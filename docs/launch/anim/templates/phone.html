<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 通用手机聊天模板：读 window.SCENE（场景 JSON）和 window.LANG（"zh"/"en"），播完设 window.__done = true。
     画面 1280×720，来源：docs/launch/x-15s.md「成片规格：1280×720 mp4」。
     布局、配色照搬样品 phone.html（Discord 移动端深色主题）。 -->
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body { background:radial-gradient(ellipse at 50% 40%, #2a2d5a 0%, #0d0e1a 70%); font:15px/1.4 -apple-system,"Helvetica Neue","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif; display:flex; align-items:center; justify-content:center; gap:70px; }
  .caption { color:#fff; width:400px; font-size:40px; font-weight:700; line-height:1.15; letter-spacing:-.5px; opacity:0; transform:translateY(12px); transition:all .6s ease; white-space:pre-line; }
  .caption.on { opacity:1; transform:none; }
  .caption small { display:block; font-size:18px; font-weight:500; color:#a5a9d6; margin-top:14px; letter-spacing:0; }
  /* 有 headline 时：去掉左侧大字，手机居中、缩小，给上方大字卡和底部 80px 字幕留位置 */
  body.hl { display:block; }
  body.hl .caption { display:none; }
  body.hl .stage { position:absolute; transition:left .6s ease; left:50%; top:112px; transform:translateX(-50%) scale(.79); transform-origin:top center; }
  .stage { position:relative; }
  /* 环境光晕（Gemini 美术意见） */
  .stage::before { content:""; position:absolute; inset:-90px -140px; border-radius:50%; background:radial-gradient(closest-side, rgba(88,101,242,.75), rgba(59,165,93,.22) 60%, transparent); filter:blur(30px); z-index:-1; }
  .phone { width:330px; height:660px; border-radius:50px; background:#111; padding:12px; box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #333; position:relative; }
  .screen { width:100%; height:100%; border-radius:40px; background:#313338; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .island { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:96px; height:28px; background:#000; border-radius:16px; z-index:3; }
  .status { height:46px; display:flex; justify-content:space-between; align-items:flex-end; padding:0 26px 6px; color:#fff; font-size:13px; font-weight:600; }
  .head { height:44px; display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:1px solid #1f2023; color:#f2f3f5; font-weight:600; }
  .head .hash { color:#80848e; font-size:20px; font-weight:400; }
  .chat { flex:1; padding:8px 10px; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; overflow:hidden; }
  .msg { display:flex; gap:10px; padding:5px 6px; margin:0 -6px; border-radius:8px; opacity:0; transform:translateY(16px) scale(.85); transform-origin:left bottom; transition:background .6s ease; }
  /* 弹簧弹出：cubic-bezier 带过冲 */
  .msg.on { animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes pop { 0% { opacity:0; transform:translateY(16px) scale(.85); } 100% { opacity:1; transform:none; } }
  /* 最新一条短暂高亮 */
  .msg.hot { background:rgba(88,101,242,.22); box-shadow:inset 3px 0 0 #5865f2; }
  .tag { display:inline-block; background:rgba(255,255,255,.1); color:#c9cdfb; font-size:10px; font-weight:600; border:1px solid rgba(255,255,255,.18); border-radius:9px; padding:0 6px; margin-left:5px; vertical-align:1px; }
  .badge { display:inline-flex; align-items:center; gap:6px; margin:4px 0 4px 44px; padding:5px 11px; border-radius:14px; background:#238636; color:#fff; font-size:13px; font-weight:700; box-shadow:0 4px 16px rgba(35,134,54,.5); opacity:0; transform:scale(.4); transform-origin:left center; align-self:flex-start; }
  .badge.on { animation:pop2 .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes pop2 { 0% { opacity:0; transform:scale(.4); } 100% { opacity:1; transform:none; } }
  .badge svg { width:14px; height:14px; }
  .wiki { position:absolute; left:100%; top:120px; margin-left:40px; width:300px; background:#f6f7fb; color:#1f2328; border-radius:14px; padding:18px 18px 14px; box-shadow:0 24px 60px rgba(0,0,0,.5); opacity:0; transform:translateX(80px); transition:all .6s cubic-bezier(.34,1.3,.64,1); }
  .wiki.on { opacity:1; transform:none; }
  .wiki .wt { font-size:18px; font-weight:800; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid #d0d7de; }
  .wiki .wt::before { content:"📖 "; }
  .wiki .wl { font-size:14px; padding:4px 6px; border-radius:5px; color:#424a53; }
  .wiki .wl.hi { background:#fff3b0; color:#1f2328; font-weight:600; }
  /* 放大镜模式（SCENE.zoom，默认有 headline 时开）：手机放左侧约 1/3，右侧约 2/3 放大最新消息。
     来源：用户「2是看不懂你说啥」+ Gemini 意见「一眼看不懂、手机大片空白、聊天字太小」，派活要求最新消息字号至少约 22px。 */
  body.zoom .stage { left:90px; transform:scale(.79); transform-origin:top left; }  /* .79 沿用原 headline 缩放，手机底边 112+660×.79≈633 < 640，不压底部 80px */
  body.zoom .chat { justify-content:flex-start; padding-top:14px; }  /* 对话贴顶，不留上半截空白 */
  .feed { display:none; }
  body.zoom .feed { display:flex; position:absolute; left:440px; top:130px; width:790px; height:500px; flex-direction:column; justify-content:center; gap:18px; transition:opacity .4s ease; }  /* 右侧区域 x 440–1230、y 130–630，底边不进底部 80px */
  /* 卡片在右侧区域内竖直居中：只有一张时不贴底留大片空白 */
  .feed.away { opacity:0; }
  .zc { display:flex; gap:20px; padding:18px 24px; border-radius:18px; background:rgba(49,51,56,.92); box-shadow:0 18px 50px rgba(0,0,0,.45), inset 4px 0 0 #5865f2; transform-origin:left bottom; transition:opacity .5s ease, transform .5s ease; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  .zc.old { opacity:.6; transform:scale(.94); box-shadow:none; }  /* 旧卡变淡缩小；不透明度 .4→.6 来自 Gemini 三审「旧卡正文太暗看不清」+ 派活要求「约 60%」。.zc 只在 zoom 的 .feed 里出现 */
  .zc.old .tx { color:#eceef1; }  /* 旧卡正文提亮（原 #dbdee1），目测取值，同一条 Gemini 三审意见 */
  .zc .av { width:60px; height:60px; font-size:28px; }
  .zc .nm { font-size:26px; }
  .zc .bot { font-size:16px; padding:1px 6px; border-radius:5px; vertical-align:4px; }
  .zc .tag { font-size:17px; padding:1px 10px; border-radius:12px; vertical-align:4px; }
  .zc .tx { font-size:30px; line-height:1.35; margin-top:4px; }  /* 正文 30px ≈ 手机内 14px 的 2 倍，满足「至少约 22px」 */
  .zc .badge { margin:12px 0 0; font-size:22px; padding:8px 18px; border-radius:22px; }
  .zc .badge svg { width:22px; height:22px; }
  /* 任务分支卡（step "lanes"，第 5 镜）：两张并排同时弹出，顶部色条用角色色。尺寸为目测取值，放大字号同 .zc（30px），无外部来源 */
  .lanes { display:flex; gap:28px; }
  .lane { flex:1; padding:26px 28px; border-radius:18px; background:rgba(49,51,56,.92); box-shadow:inset 0 6px 0 var(--c), 0 18px 50px rgba(0,0,0,.45); animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  .lane .lt { font-size:30px; font-weight:700; line-height:1.3; }
  .lane .lw { display:flex; align-items:center; gap:12px; margin-top:18px; font-size:24px; font-weight:700; color:var(--c); }
  .lane .lw::before { content:"→"; color:#b5bac1; }
  .lane .av { width:48px; height:48px; font-size:24px; }
  .lane .lb { margin-top:16px; font-size:20px; color:var(--c); }
  .lane .lb i { font-style:normal; animation:b 1.2s steps(1) infinite; }
  .lane .lb i:nth-child(2) { animation-delay:.4s; } .lane .lb i:nth-child(3) { animation-delay:.8s; }
  /* zoom 下的 wiki 卡：来源 用户「2是看不懂你说啥」+ 派活要求（占满右侧大部分、上下居中、标题约 34px、行约 28px、高亮醒目、顶部面包屑）。
     卡片在 .79 缩放的 stage 内，下面的数都是 stage 坐标，换算：屏幕 = 90 + stage×.79（x）、112 + stage×.79（y），90/112/.79 来自上面 body.zoom .stage。
     目标屏幕位置：右侧区域 x 440–1230、y 130–630（同 .feed），卡宽 720（自定，约占区域 790 的九成），水平居中 → 屏幕 x 475 → stage left (475-90)/.79≈487 = 330(手机宽)+157。
     竖直居中：区域中线屏幕 y 380 → stage (380-112)/.79≈339。 */
  body.zoom .wiki { top:339px; margin-left:157px; width:911px; padding:40px 48px 36px; border-radius:24px; transform:translate(80px,-50%); }  /* 911≈720/.79 */
  body.zoom .wiki.on { transform:translateY(-50%); }
  .wiki .wp { display:none; }
  body.zoom .wiki .wp { display:block; font-size:24px; color:#57606a; margin-bottom:10px; font-family:ui-monospace,Menlo,monospace; }  /* 面包屑屏幕约 19px，自定 */
  body.zoom .wiki .wt { font-size:43px; padding-bottom:16px; margin-bottom:18px; }  /* 屏幕 34px = 43×.79 */
  body.zoom .wiki .wl { font-size:35px; padding:10px 18px; border-radius:10px; margin:4px 0; }  /* 屏幕 28px ≈ 35×.79 */
  body.zoom .wiki .wl.hi { background:rgba(240,178,50,.18); box-shadow:inset 8px 0 0 #f0b232; color:#ffe2a8; font-weight:800; }  /* Gemini 二审第 7 镜「黄色高亮块刺眼」→ 柔和琥珀半透明底 + 左色条（派活要求）；琥珀 #f0b232 取自 v2-assemble 笔杆色 */
  /* zoom 下 wiki 卡改暗色毛玻璃：Gemini 二审第 7 镜「纯白闪光弹」；底色参考 #1E2230（派活要求），透明度/边框/发光强度为目测取值。只影响 zoom（有 headline 的 v2 镜），x-memory 不走 zoom */
  body.zoom .wiki { background:rgba(30,34,48,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1.5px solid rgba(139,147,255,.35);
    box-shadow:0 0 44px -4px rgba(88,101,242,.45), 0 24px 60px rgba(0,0,0,.5); color:#eef1ff; }
  body.zoom .wiki .wp { color:#8b93c9; }
  body.zoom .wiki .wt { color:#fff; border-bottom-color:rgba(255,255,255,.14); }
  body.zoom .wiki .wl { color:#c9d6ff; }
  .av { width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; font-weight:700; }
  .nm { font-weight:600; color:#f2f3f5; font-size:14px; }
  .bot { background:#5865f2; color:#fff; font-size:9px; font-weight:600; border-radius:3px; padding:1px 3px; margin-left:4px; vertical-align:2px; }
  .tx { color:#dbdee1; font-size:14px; }
  .m { background:rgba(88,101,242,.3); color:#c9cdfb; border-radius:3px; padding:0 2px; font-weight:500; }
  .link { color:#00a8fc; }
  .typing { height:22px; padding:0 14px; color:#b5bac1; font-size:12px; opacity:0; transition:opacity .2s; }
  .typing.on { opacity:1; }
  .input { margin:6px 10px 24px; height:40px; border-radius:20px; background:#383a40; color:#6d6f78; display:flex; align-items:center; padding:0 16px; font-size:14px; white-space:nowrap; overflow:hidden; }
  .input.typed { color:#dbdee1; }
  .cursor { display:inline-block; width:1px; height:16px; background:#dbdee1; margin-left:1px; animation:b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity:0; } }
</style>
</head>
<body>
<div class="caption" id="cap"></div>
<div class="stage"><div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status"><span id="clock"></span><span>●●● 5G ▮</span></div>
  <div class="head"><span class="hash">#</span><span id="chan"></span></div>
  <div class="chat" id="chat"></div>
  <div class="typing" id="typing"></div>
  <div class="input" id="input"></div>
</div></div><div class="wiki" id="wiki"></div></div>
<div class="feed" id="feed"></div>
<script src="common.js"></script>

<script>
const S = window.SCENE, L = window.LANG || 'en';
// 双语字段取当前语言；纯字符串原样返回
const t = v => (v && typeof v === 'object') ? (v[L] ?? v.en ?? '') : (v ?? '');
const UI = {
  placeholder: { zh: c => `给 #${c} 发消息`, en: c => `Message #${c}` },
  busy:        { zh: n => `${n} 正在输入…`,   en: n => `${n} is typing…` },
};
UI.lane = { zh: '进行中', en: 'In progress' };  // 任务分支卡的状态字，来源：派活要求「进行中…」；单张卡可用 lanes[].status 覆盖（第 5 镜笔杆卡「撰写中…」，派活要求）
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 已知角色名（当前语言）按长度降序，@后面优先匹配角色名，中文名后不用加空格
const names = Object.values(S.roles).map(r => t(r.name)).sort((a, b) => b.length - a.length);
function fmt(raw) {
  let s = esc(raw);
  s = s.replace(/\[\[(.+?)\]\]/g, '<span class="link">$1</span>');
  s = s.replace(/@(\S+)/g, (all, rest) => {
    const n = names.find(n => rest.startsWith(n)) ?? rest;
    return `<span class="m">@${n}</span>` + rest.slice(n.length);
  });
  return s;
}
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), typing = $('typing');
const chan = t(S.channel);
const placeholder = () => { input.classList.remove('typed'); input.textContent = UI.placeholder[L](chan); };
$('chan').textContent = chan;
$('clock').textContent = S.clock || '9:12';  // 状态栏时间，样品 phone.html 写的 9:12
$('cap').innerHTML = esc(t(S.caption)) + (S.sub ? `<small>${esc(t(S.sub))}</small>` : '');
placeholder();
if (S.headline) document.body.classList.add('hl');
// 放大镜开关：场景写了 zoom 就照写的，没写时有 headline 就开，旧 x-* 场景（无 headline）不受影响
const ZOOM = S.zoom ?? !!S.headline;
if (ZOOM) document.body.classList.add('zoom');
const feed = $('feed');

let hotTm;
function show(d) {
  chat.appendChild(d); requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('on')));
}
function say(who, text, zoom = true) {
  const r = S.roles[who], d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = `<div class="av" style="background:${r.color}">${esc(r.avatar || t(r.name)[0])}</div><div><div class="nm">${esc(t(r.name))}${r.bot ? '<span class="bot">BOT</span>' : ''}${r.tag ? `<span class="tag">${esc(t(r.tag))}</span>` : ''}</div><div class="tx">${fmt(text)}</div></div>`;
  chat.querySelectorAll('.msg.hot').forEach(e => e.classList.remove('hot'));
  d.classList.add('hot'); clearTimeout(hotTm);
  hotTm = setTimeout(() => d.classList.remove('hot'), 900);  // 高亮 900ms：自定，够看清又不抢下一条
  show(d);
  if (ZOOM && zoom !== false) {  // step 写 "zoom": false 时只进手机，不在右侧放大
    const z = document.createElement('div'); z.className = 'zc';
    z.innerHTML = d.innerHTML;
    feed.querySelectorAll('.zc').forEach(e => e.classList.add('old'));
    feed.appendChild(z);
    const all = feed.querySelectorAll('.zc');
    if (all.length > (S.zoom_max ?? 3)) all[0].remove();  // 默认最多留 3 张，来源：派活要求「最多保留 2–3 张」；场景可用 zoom_max 改
  }
}
function type(text, ms) {
  const chars = [...text];
  return new Promise(res => {
    input.classList.add('typed'); let i = 0;
    const tm = setInterval(() => { i++; input.innerHTML = esc(chars.slice(0, i).join('')) + '<span class="cursor"></span>'; if (i >= chars.length) { clearInterval(tm); res(); } }, ms / chars.length);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
// 默认时长照搬样品 phone.html 的时间线：开场 300ms，打字 1100ms，正在输入 500ms，结尾停 1200ms
const D = { start: 300, type: 1100, busy: 500, end: 1200, ...(S.timing || {}) };

(async () => {
  window.__start = Date.now();  // 开播时刻，render.py 按 [__start, __done] 裁剪
  BH.overlay();
  await wait(D.start);
  $('cap').classList.add('on');
  for (const st of S.steps) {
    if ('type' in st) {
      // 输入框打字，打完自动作为第一个角色（S.me，默认 "you"）发出
      const text = t(st.type);
      await type(text, st.ms ?? D.type);
      await wait(150);  // 打完到发出的停顿，样品 phone.html 的 150ms
      placeholder();
      say(st.as || S.me || 'you', text);
    } else if ('say' in st) {
      say(st.say, t(st.text), st.zoom);
    } else if ('busy' in st) {
      typing.textContent = UI.busy[L](t(S.roles[st.busy].name)); typing.classList.add('on');
      await wait(st.ms ?? D.busy);
      typing.classList.remove('on');
    } else if ('badge' in st) {
      // 最后一条消息下弹出绿色 PR 徽章（GitHub 合并绿）
      const d = document.createElement('div'); d.className = 'badge';
      // 可选 "icon": false 去掉 PR 图标（第 8 镜「新规矩 +1」不是 PR）
      d.innerHTML = (st.icon === false ? '' : `<svg viewBox="0 0 16 16" fill="#fff"><path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0V5.372zM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5zm7.5-6.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5zm-.75 1.372a2.25 2.25 0 1 1 1.5 0v3.756a2.251 2.251 0 1 1-1.5 0V6.622zM11.75 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5z"/></svg>`) + esc(t(st.badge));
      chat.appendChild(d); requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('on')));
      const zl = ZOOM && feed.lastElementChild;
      if (zl) { const b = d.cloneNode(true); zl.lastElementChild.appendChild(b); requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('on'))); }
    } else if ('lanes' in st) {
      // 右侧并排「任务分支」卡（第 5 镜）：[{who, text, busy}]，同时弹出，表达各走各的线；只在 zoom 下画
      if (ZOOM) {
        const box = document.createElement('div'); box.className = 'lanes';
        box.innerHTML = st.lanes.map(x => { const r = S.roles[x.who]; return `<div class="lane" style="--c:${r.color}"><div class="lt">${esc(t(x.text))}</div><div class="lw"><div class="av" style="background:${r.color}">${esc(r.avatar || t(r.name)[0])}</div><span>${esc(t(r.name))}</span></div>${x.busy || x.status ? `<div class="lb">${esc(x.status ? t(x.status) : t(UI.lane))}<i>.</i><i>.</i><i>.</i></div>` : ''}</div>`; }).join('');
        feed.appendChild(box);
      }
    } else if ('wiki' in st) {
      // 侧边滑入 wiki 页面卡片；lines 里带 "hi": true 的那行高亮，没标就高亮第一行
      const w = st.wiki, ls = w.lines || [], hi = Math.max(0, ls.findIndex(x => x.hi));
      $('wiki').innerHTML = (w.path ? `<div class="wp">${esc(t(w.path))}</div>` : '') + `<div class="wt">${esc(t(w.title))}</div>` + ls.map((x, i) => `<div class="wl${i === hi ? ' hi' : ''}">${esc(t(x))}</div>`).join('');
      $('wiki').classList.add('on');
      if (ZOOM) feed.classList.add('away');  // 放大卡片给 wiki 卡让位
      else if (S.headline) document.querySelector('.stage').style.left = 'calc(50% - 200px)';  // 卡片出现时手机左移，整体居中
    } else if ('wait' in st) {
      await wait(st.wait);
    }
  }
  await wait(D.end);
  window.__done = true;
})();
</script>
</body>
</html>
