<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  windows 模板：四个 AI 窗口 + 光标来回复制粘贴同一段背景，越来越快。
  读 window.SCENE（scenes/*.json，template:"windows"）和 window.LANG（"zh"/"en"），播完设 window.__done = true。
  文案、窗口名、节奏全在场景 JSON；本文件不写死文案。
  画面 1280×720：来源 docs/launch/x-15s.md「成片规格：1280×720 mp4」。
  配色/字体/背景：照 scratchpad/phone/phone.html（深蓝径向渐变、白色大字）。
-->
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  /* 1280×720：x-15s.md 成片规格 */
  html,body { width:1280px; height:720px; overflow:hidden; }
  /* 背景渐变色值照 phone.html */
  body { background:radial-gradient(ellipse at 50% 40%, #2a2d5a 0%, #0d0e1a 70%); font:15px/1.4 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif; position:relative; }
  /* 字幕字号/字重照 phone.html .caption（40px/700），这里居中放顶部所以略放大到 44px 便于手机上看 */
  .caption { position:absolute; top:44px; left:0; right:0; text-align:center; color:#fff; font-size:44px; font-weight:700; letter-spacing:-.5px; opacity:0; transform:translateY(12px); transition:all .5s ease; }
  .caption.on { opacity:1; transform:none; }
  /* 2×2 窗口网格：两列 470 宽 + 间距 36，整体约 976 宽，在 1280 内居中；顶部留 140 给字幕（排版取值，无外部来源） */
  .grid { position:absolute; top:140px; left:50%; transform:translateX(-50%); display:grid; grid-template-columns:470px 470px; grid-auto-rows:255px; gap:30px 36px; }
  .win { background:#1e1f26; border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 0 1px #34364a; display:flex; flex-direction:column; overflow:hidden; transition:transform .12s ease; }
  .win.hit { transform:scale(1.025); }
  .bar { height:34px; display:flex; align-items:center; gap:7px; padding:0 12px; background:#272935; border-bottom:1px solid #1a1b22; }
  .dot { width:11px; height:11px; border-radius:50%; }
  .name { margin-left:10px; color:#e8e9f3; font-weight:600; font-size:14px; display:flex; align-items:center; gap:7px; }
  .badge { width:14px; height:14px; border-radius:4px; }
  .body { flex:1; padding:14px 16px; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; position:relative; }
  .empty { position:absolute; top:42%; left:0; right:0; text-align:center; color:#5d6079; font-size:15px; transition:opacity .15s; }
  .bubble { align-self:flex-end; max-width:88%; background:#3b3f8f; color:#eef0ff; border-radius:12px 12px 3px 12px; padding:8px 12px; font-size:13px; line-height:1.45; opacity:0; transform:translateY(8px); transition:all .18s ease; }
  .bubble.on { opacity:1; transform:none; }
  .bubble.sel { background:#2f6fd6; box-shadow:0 0 0 2px #7fb0ff; }
  .input { height:34px; border-radius:9px; background:#2b2d3a; color:#6d7090; display:flex; align-items:center; padding:0 12px; font-size:13px; }
  .key { position:absolute; right:14px; top:10px; background:#fff; color:#111; font-weight:700; font-size:13px; border-radius:6px; padding:2px 7px; opacity:0; transform:scale(.7); transition:all .12s ease; }
  .key.on { opacity:1; transform:none; }
  #cursor { position:absolute; left:0; top:0; width:26px; height:26px; z-index:10; pointer-events:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div class="caption" id="cap"></div>
<div class="grid" id="grid"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.6 L11 13.8 L18 13.8 Z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
<script>
(async () => {
  const S = window.SCENE, L = window.LANG || 'en';
  const t = v => (v && typeof v === 'object') ? (v[L] ?? v.en) : v;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  document.documentElement.lang = L === 'zh' ? 'zh-CN' : 'en';
  const cap = document.getElementById('cap'), grid = document.getElementById('grid'), cur = document.getElementById('cursor');
  cap.textContent = t(S.caption);

  const W = S.windows.map(w => {
    const el = document.createElement('div');
    el.className = 'win';
    // 三个圆点色：macOS 窗口通用红黄绿
    el.innerHTML = `<div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="name"><span class="badge" style="background:${w.color}"></span></span></div>
      <div class="body"><div class="empty"></div><div class="key"></div><div class="bubble"></div></div><div class="input"></div>`;
    el.querySelector('.name').append(t(w.name));
    el.querySelector('.empty').textContent = t(S.newChat);
    el.querySelector('.key').textContent = t(S.pasteKey);
    el.querySelector('.bubble').textContent = t(S.context);
    el.querySelector('.input').textContent = '…';
    grid.appendChild(el);
    return el;
  });
  const q = (i, s) => W[i].querySelector(s);

  // 光标落点：窗口输入框附近
  function aim(i) {
    const r = q(i, '.input').getBoundingClientRect();
    return [r.left + r.width * 0.55, r.top + r.height * 0.4];
  }
  function moveTo(i, ms) {
    const [x, y] = aim(i);
    cur.style.transition = `transform ${ms}ms cubic-bezier(.5,0,.3,1)`;
    cur.style.transform = `translate(${x}px, ${y}px)`;
  }
  function show(i, on) {
    q(i, '.bubble').classList.toggle('on', on);
    q(i, '.empty').style.opacity = on ? 0 : 1;
  }

  // 起手：第 0 个窗口已有那段背景，被选中复制
  show(0, true);
  q(0, '.bubble').classList.add('sel');
  const [x0, y0] = aim(0);
  cur.style.transform = `translate(${x0}px, ${y0 - 60}px)`;
  window.__start = Date.now();  // 开播时刻，render.py 按 [__start, __done] 裁剪
  await wait(50);
  cap.classList.add('on');
  moveTo(0, S.startMs);
  await wait(S.startMs);
  q(0, '.bubble').classList.remove('sel');

  // 每一跳：光标飞向窗口时它先「失忆」清空 → 到达 ⌘V → 气泡重新出现。间隔取 S.hopsMs，逐跳变短
  for (let k = 0; k < S.order.length; k++) {
    const i = S.order[k], ms = S.hopsMs[Math.min(k, S.hopsMs.length - 1)];
    // 移动占这一跳的 65%，余下给粘贴反馈（节奏取值，无外部来源）
    const move = Math.round(ms * 0.65);
    moveTo(i, move);
    show(i, false);
    await wait(move);
    const key = q(i, '.key');
    key.classList.add('on'); W[i].classList.add('hit');
    show(i, true);
    await wait(ms - move);
    key.classList.remove('on'); W[i].classList.remove('hit');
  }
  await wait(S.endMs);
  window.__done = true;
})();
</script>
</body>
</html>
