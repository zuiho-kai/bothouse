<!doctype html>
<html><head><meta charset="utf-8">
<!--
  outro4 模板（v4 镜8 片尾）：白黄亮底，左边五人比耶合影，右边 bothouse 标志、一行口号、GitHub 地址胶囊。
  来源：脚本 v4.1 镜8「五人比耶，标志、『AI 娘们的家 · 开源』、GitHub 地址」；用户原话「从我们那边开始都要有白底明亮的背景」。
  场景字段：img（合影）、slogan{zh,en}、repo（地址文字）、credit{zh,en}（音乐署名小字，可省）、total（毫秒）。
  底部 80px 留给字幕。像素位置和动画时长是排版取值（目测），不是参数。
-->
<link rel="stylesheet" href="v4.css">
<style>
  /* 合影是白底图：multiply 让白底融进奶黄背景，不露白框 */
  #pic { position:absolute; left:10px; top:40px; width:780px; mix-blend-mode:multiply; opacity:0; transform:translateY(40px) scale(.92); transition:all .55s cubic-bezier(.34,1.5,.64,1); }
  #pic.on { opacity:1; transform:none; }
  .right { position:absolute; left:780px; right:30px; top:150px; display:flex; flex-direction:column; align-items:center; gap:26px; }
  #logo { opacity:0; transform:scale(.4); }
  #logo.on { animation:pop .5s cubic-bezier(.34,1.7,.64,1) forwards; }
  #logo .logo span { font-size:70px; }
  @keyframes pop { to { opacity:1; transform:none; } }
  #slogan { font-size:38px; color:#f08a24; letter-spacing:2px; white-space:nowrap; opacity:0; transform:translateY(12px); transition:all .4s ease; }
  #repo { display:flex; align-items:center; gap:10px; background:#3b2a18; color:#fff; border-radius:999px; padding:12px 24px; white-space:nowrap;
    font:700 24px/1 "Avenir Next","Helvetica Neue",Arial,sans-serif; box-shadow:0 6px 0 rgba(0,0,0,.12); opacity:0; transform:translateY(12px); transition:all .4s ease; }
  #slogan.on, #repo.on { opacity:1; transform:none; }
  #credit { position:absolute; left:0; right:0; bottom:88px; text-align:center; font:500 13px/1 "Avenir Next",Arial,sans-serif; color:#b49a70; opacity:0; transition:opacity .4s; }
  #credit.on { opacity:1; }
</style></head>
<body class="bright">
<img id="pic">
<div class="right"><div id="logo"></div><div id="slogan"></div><div id="repo"></div></div>
<div id="credit"></div>
<script src="v4.js"></script>
<script>
(async () => {
  const S = window.SCENE, { t, wait, logo, sparks } = V4;
  sparks(document.body, [[820, 70, 1.2], [1200, 110, 1, .4], [1180, 470, .9, .7], [60, 30, 1, .2]]);
  const pic = document.getElementById('pic'); pic.src = S.img;
  document.getElementById('logo').innerHTML = logo(76);
  document.getElementById('slogan').textContent = t(S.slogan);
  // GitHub 小猫图标（Octicons mark-github 路径，画面图形不是参数）
  document.getElementById('repo').innerHTML = `<svg width="26" height="26" viewBox="0 0 16 16" fill="#fff"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>${t(S.repo)}</span>`;
  if (S.credit) document.getElementById('credit').textContent = t(S.credit);
  await pic.decode().catch(() => {});
  await document.fonts.ready; V4.start();
  const T0 = Date.now();
  pic.classList.add('on');
  await wait(300); document.getElementById('logo').classList.add('on');
  await wait(350); document.getElementById('slogan').classList.add('on');
  await wait(300); document.getElementById('repo').classList.add('on');
  document.getElementById('credit').classList.add('on');
  await wait(Math.max(0, S.total - (Date.now() - T0)));
  V4.done();
})();
</script></body></html>
