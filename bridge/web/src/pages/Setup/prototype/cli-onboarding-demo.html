<body><div id="app"></div><div id="overlay"></div><div id="toast" aria-live="polite"></div><script>
/* Portable state model: no DOM, timers, credentials, or network inside this block. */
const tools = [
 {id:'codex',name:'Codex CLI',letter:'C',desc:'作为你的主助理，协调团队',role:'主助理',color:'codex'},
 {id:'claude',name:'Claude Code',letter:'A',desc:'加入团队，负责独立任务',role:'协作成员',color:'claude'},
 {id:'gemini',name:'Gemini CLI',letter:'G',desc:'按需接入，统一在这里使用',role:'协作成员',color:'gemini'},
 {id:'opencode',name:'OpenCode',letter:'O',desc:'接入你自己的模型服务',role:'协作成员',color:'opencode'}
];
const scenes = [
 {id:'fresh',name:'全新电脑',desc:'没有安装工具或登录信息。选择 CLI 后，安装自动进行；你只需逐个完成授权。',guide:['开始自动准备','等待安装完成','为选中的工具逐个模拟授权','创建团队，进入聊天']},
 {id:'existing',name:'已有工具与登录',desc:'模拟已安装并登录 Codex、Claude Code。检查后直接复用，不要求重复安装或授权。',guide:['开始自动准备','等待复用已有登录','创建团队，进入聊天']},
 {id:'failure',name:'下载失败后重试',desc:'模拟 Claude Code 首次下载失败。Codex 的进度保留，可以单独重试，或先用已连接的成员。',guide:['开始自动准备','等待 Claude 下载失败','仅重试 Claude，或先用 Codex','授权并进入聊天']}
];
function initial(scene){return {scene:scene,phase:'welcome',env:'idle',teamName:'我的 AI 团队',notice:'',events:[],turn:0,messages:[],tools:tools.map(t=>({id:t.id,selected:t.id==='codex'||t.id==='claude',status:'idle',attempt:0,source:''}))};}
function note(s,msg){s.events.push(msg);s.events=s.events.slice(-6);}
function ready(s){return s.tools.filter(t=>t.selected&&t.status==='ready');}
function nextState(state,action){
 const s=structuredClone(state);const t=s.tools.find(t=>t.id===action.id);s.notice='';
 if(action.type==='toggle'&&s.phase==='welcome'&&t)t.selected=!t.selected;
 if(action.type==='start'&&s.phase==='welcome'){
  if(!s.tools.some(t=>t.selected)){s.notice='至少选一个 AI 工具，就能开始。';return s;}
  s.phase='setup';s.env='checking';note(s,'已开始检查本机环境。');
 }
 if(action.type==='advance'&&s.phase==='setup'){
  if(s.env==='checking'){s.env='ready';note(s,'本机聊天运行环境已就绪（模拟）。');s.tools.filter(t=>t.selected).forEach(t=>{t.status='detecting';});return s;}
  const job=s.tools.find(t=>t.selected&&['detecting','queued','installing','verifying'].includes(t.status));
  if(!job)return s;
  const name=tools.find(t=>t.id===job.id).name;
  if(job.status==='detecting'){
   if(s.scene==='existing'&&['codex','claude'].includes(job.id)){job.status='verifying';job.source='复用已有登录';note(s,name+'：发现已有安装与登录。');}
   else{job.status='queued';note(s,name+'：缺失工具，已加入安装队列。');}
  }else if(job.status==='queued'){job.status='installing';job.attempt++;note(s,'正在从官方来源准备 '+name+'（模拟）。');}
  else if(job.status==='installing'){
   if(s.scene==='failure'&&job.id==='claude'&&job.attempt===1){job.status='failed';note(s,name+' 下载中断，其他成员进度已保留。');}
   else{job.status='authorize';note(s,name+' 已安装，等待你连接账号。');}
  }else if(job.status==='verifying'){job.status='ready';note(s,name+' 示例连接验证通过。');}
 }
 if(action.type==='authorize'&&t&&t.status==='authorize'){
  t.status='verifying';t.source=action.method==='key'?'示例 API 连接':'账号授权';note(s,tools.find(v=>v.id===t.id).name+'：模拟授权完成，正在验证连接。');
 }
 if(action.type==='retry'&&t&&t.status==='failed'){t.status='queued';note(s,'仅重试 '+tools.find(v=>v.id===t.id).name+'，不重置其他成员。');}
 if(action.type==='skip'&&t&&s.phase==='setup'){if(s.tools.filter(v=>v.selected).length===1){s.notice='至少保留一位成员。你可以重试下载或完成授权。';return s;}t.selected=false;t.status='skipped';note(s,'已暂时跳过 '+tools.find(v=>v.id===t.id).name+'。');}
 if(action.type==='continue'){
  const linked=ready(s);const remaining=s.tools.filter(t=>t.selected&&t.status!=='ready');

document.addEventListener('click',e=>{if(e.target.dataset.dismiss){if(e.target.dataset.dismiss==='modal')modal='';else sheet=false;renderOverlay();return;}const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='home'||a==='manager'||a==='chat'){view=a==='chat'&&state.phase!=='chat'?'home':a;render();}else if(a==='select')selectTool(id);else if(a==='setup')startSetup();else if(a==='enter')enter();else if(a==='close-sheet'){sheet=false;renderOverlay();}else if(a==='close-modal'){modal='';renderOverlay();}else if(a==='scenes'){modal='scenes';renderOverlay();}else if(a==='scene'){clearTimeout(timer);state=initial(id);sheet=false;modal='';view='home';draft='';queuedDraft='';recent='';render();}else if(a==='auth-open'){modal=id;renderOverlay();}else if(a==='authorize'||a==='auth-key'){modal='';dispatch({type:'authorize',id,method:a==='auth-key'?'key':'account'});}else if(a==='retry')dispatch({type:'retry',id});else if(a==='connect-tool')addTool(id);else if(a==='toggle-tool'){const t=state.tools.find(t=>t.id===id);if(t.selected){if(state.tools.filter(t=>t.selected).length===1){toast('至少保留一位助理。');return;}t.selected=false;render();}else addTool(id);}else if(a==='configure'){sheet=true;renderOverlay();}else if(a==='new-chat'){if(state.phase==='chat'){state.messages=state.messages.slice(0,1);state.turn=0;view='chat';recent='';draft='';render();}else{view='home';draft='';render();}}else if(a.startsWith('prompt-')){draft={ 'prompt-video':'一起策划一个 30 秒的项目演示视频，突出一键使用和团队协作。','prompt-code':'把我的想法做成一个能用的产品，先帮我梳理需求与分工。','prompt-research':'帮我研究个人 AI 助理的使用痛点，再让团队交叉审核。'}[a];render();document.getElementById('draft').focus();}else if(a==='team-info'){sheet=true;renderOverlay();}else if(a==='workflow'){toast('协作流程在连接团队后展示。先给团队发一个任务。');}else if(a==='history'){toast(recent?'最近任务：'+recent:'开始一段对话后，任务会出现在这里。');}else if(a==='devices'){toast('本 Demo 只展示本机网页流程，手机连接将在后续接入。');}else if(a==='folder'||a==='attach'){toast('演示使用本机示例工作区，不读取你的文件。');}});
/* Channel model: independent conversations and task states per room, in memory only. */
const rooms=[
 {id:'video',name:'项目视频',description:'把产品讲清楚，一起完成第一支演示视频。',icon:'play',topic:'30 秒产品演示',memory:'产品定位：个人助理集群。突出一键使用、频道协作与结果交付。',posts:[
  {who:'user',text:'我们拍一个 30 秒的项目视频吧。抓住“工具装了一堆，还没开始干活”的痛点，展示大家在一个频道里协作。',time:'10:24'},
  {who:'lead',text:'好。我负责整体叙事和最终汇总。\n@Claude Code 起草分镜，重点放在从打开应用到团队协作的过程。\n@Gemini CLI 从新用户视角检查，找出还需要解释的地方。',time:'10:24'},
  {who:'handoff',text:'Codex CLI → Claude Code：起草分镜，只交回分镜与建议。'},
  {who:'claude',text:'分镜初稿已经整理好。\n前 5 秒呈现配置卡点，中间 15 秒展示一键连接和频道分工，最后 10 秒用一份真实交付收尾。',time:'10:25',file:'产品演示分镜 · v1.md'},
  {who:'handoff',text:'Claude Code → Codex CLI：已交回分镜，等待汇总。'},
  {who:'gemini',text:'从新用户视角看，“自动安装”和“账号授权”需要分开讲。建议保留一个授权画面，让观众清楚哪些步骤仍由自己决定。',time:'10:26'},
  {who:'lead',text:'收到。脚本采用 Claude 的分镜，补上 Gemini 建议的授权镜头。\n接下来把界面录屏串进去，我们一起看第一版。',time:'10:26'}],tasks:[['梳理叙事与分工','Codex CLI','done'],['起草 30 秒分镜','Claude Code','done'],['检查首次使用门槛','Gemini CLI','done'],['汇总并等待你确认','Codex CLI','active']]},
 {id:'product',name:'产品开发',description:'从一个需求开始，分工实现，交叉检查。',icon:'code',topic:'首次使用体验',memory:'首次入口使用自带聊天网页。Discord、飞书在后续按需连接。',posts:[{who:'user',text:'新用户第一次打开，能不能不要先看到一堆配置？先把自带频道跑起来。',time:'09:42'},{who:'lead',text:'可以。我先把验收拆成三件事：发现已有 CLI、连接可用账号、进入自己的频道。\n@Claude Code 检查缺失工具的安装与重试流程。我来检查已有配置是否被保留。',time:'09:43'},{who:'handoff',text:'Codex CLI → Claude Code：检查安装失败时的恢复路径。'},{who:'claude',text:'安装和授权需要分别记录进度。单个工具失败时，应该允许重试它，或先使用已经连接好的成员。',time:'09:44'}],tasks:[['确认首次使用验收','Codex CLI','done'],['检查安装与重试','Claude Code','active'],['验证已有配置保留','Codex CLI','active']]},
 {id:'lobby',name:'大厅',description:'临时想法、随手一问，或者给整个团队打个招呼。',icon:'chat',topic:'随时开始一件事',memory:'每个频道围绕自己的话题。这里只展示独立会话的交互原型。',posts:[{who:'lead',text:'欢迎来到你的工作室。\n可以在这里直接问我，也可以到「项目视频」看看团队怎样点名、分工和交回结果。',time:'09:00'}],tasks:[]}
];
const roomSeeds=structuredClone(rooms);
let queuedRoomID='video';let roomID='video';view='channel';let roomDrafts={video:'',product:'',lobby:''};
function currentRoom(){return rooms.find(r=>r.id===roomID);}
function memberName(who){return who==='user'?'你':who==='lead'?'Codex CLI':tools.find(t=>t.id===who)?.name||'团队成员';}
function roomNav(){return '<aside class="sidebar"><div class="sidebar-brand"><span class="workspace-mark"><b>b.</b>bothouse</span>'+btn('scenes',icon('sliders'),'icon-button','aria-label="演示设置"')+'</div><div class="workspace-name"><span>我的协作空间</span><span>⌄</span></div><div class="channel-label"><span>频道</span>'+btn('add-room','+','','aria-label="新建频道"')+'</div>'+rooms.map(r=>btn('room','<span class="hash">#</span><span>'+r.name+'</span>'+(r.id==='video'?'<small>4</small>':''),'channel-link '+(view!=='manager'&&r.id===roomID?'active':''),'data-id="'+r.id+'"')).join('')+'<div class="channel-label" style="margin-top:31px"><span>示例团队</span><span>3</span></div>'+[{id:'codex',role:'主助理'},{id:'claude',role:'开发 / 创作'},{id:'gemini',role:'检查 / 补充'}].map(m=>'<div class="sidebar-member">'+logo(m.id)+'<span>'+tools.find(t=>t.id===m.id).name+'</span><small>'+m.role+'</small></div>').join('')+btn('setup',icon('plus')+'连接你自己的 CLI','connect-side')+'<div class="sidebar-bottom"><div class="side-nav">'+btn('manager',icon('bot')+'助理与模型','')+btn('memory-info',icon('file')+'共享记忆','')+btn('devices',icon('devices')+'设备与入口','')+'</div><div class="sidebar-footer"><strong>你的本机空间</strong><span>个人版 · Demo</span></div></div></aside>';}
function channelComposer(){return '<div class="composer-wrap"><form id="compose" class="composer"><label class="sr-only" for="draft">发送到'+esc(currentRoom().name)+'频道</label><textarea id="draft" placeholder="发到 #'+esc(currentRoom().name)+'，或 @ 一位助理…" rows="2">'+esc(draft)+'</textarea><div class="composer-bottom"><div class="composer-tools">'+btn('attach',icon('plus'),'','aria-label="添加文件"')+'<span class="tool-sep"></span>'+btn('mention','@ 点名助理','')+btn('setup',icon('team')+'频道成员','')+'</div><button class="send" type="submit" aria-label="发送消息">'+icon('arrow')+'</button></div></form><p class="under-composer">默认由主助理接话 · 点名指定成员 · 每个频道保留自己的对话</p></div>';}
function messagePost(m,i){if(m.who==='handoff')return '<div class="handoff-event">'+icon('flow')+'<span>'+esc(m.text)+'</span></div>';const id=m.who==='lead'?'codex':m.who;const content=esc(m.text).replace(/@(Claude Code|Gemini CLI|Codex CLI)/g,'<span class="mention">@$1</span>');return '<article class="post">'+(m.who==='user'?'<span class="human-icon">你</span>':logo(id))+'<div class="post-main"><div class="post-header"><strong>'+memberName(m.who)+'</strong>'+(m.who==='lead'?'<small>主助理</small>':m.who==='user'?'':'<small>成员</small>')+'<time>'+(m.time||'刚刚')+'</time></div><p class="post-text">'+content+'</p>'+(m.file?'<div class="deliverable"><div class="deliverable-title">'+icon('file')+esc(m.file)+'</div><p>Claude Code 提交 · 已交回主助理</p>'+btn('preview-file','查看示例分镜 →','','data-id="'+i+'"')+'</div>':'')+'</div></article>';}
function rightPanel(){const r=currentRoom();const done=r.tasks.filter(t=>t[2]==='done').length;return '<aside class="right-panel"><p class="right-eyebrow">THIS CHANNEL</p><h2>围绕一件事，一起推进。</h2><p class="right-sub">分工、交接和结果留在频道里，<br>你随时能接着看、接着问。</p><div class="task-card"><div class="task-card-top"><div><span>当前协作</span><span class="task-pill">'+(r.tasks.length?(r.id==='video'?'待你确认':'协作中'):'等待新任务')+'</span></div><h3>'+r.topic+'</h3></div><div class="task-list">'+(r.tasks.length?r.tasks.map(t=>'<div class="task-row"><span class="task-state '+(t[2]==='active'?'active':'')+'">'+(t[2]==='done'?'✓':'·')+'</span><div class="task-copy"><strong>'+t[0]+'</strong><small>'+t[1]+(t[2]==='done'?' · 已完成':' · 进行中')+'</small></div></div>').join(''):'<p class="right-sub" style="padding:12px 0">发一个想法，主助理会帮助你拆解和分工。</p>')+'</div><div class="task-bottom"><span>'+done+' / '+r.tasks.length+' 步已完成</span><span>示例任务</span></div></div><div class="right-block"><p class="right-eyebrow">HOW WE WORK</p><h2>队长协调，成员交回。</h2><div class="flow-steps"><span>点名分工</span>'+icon('right')+'<span>各自执行</span>'+icon('right')+'<span>汇总结果</span></div><p class="right-sub">各 CLI 保留自己的身份与会话。协作交接在同一个频道中可见。</p></div><div class="right-block"><p class="right-eyebrow">SHARED CONTEXT</p><h2>这件事的共同约定</h2><div class="shared-memory"><strong>频道示例记录</strong>'+r.memory+'</div><div class="channel-actions">'+btn('memory-info','查看记录','')+btn('team-info','查看成员','')+'</div><p class="team-summary">记忆、任务和对话均为示例数据。真实连接由各 CLI 授权后建立。</p></div></aside>';}
function channel(){const r=currentRoom();const connected=ready(state).length;return '<div class="channel-layout"><section class="channel-stream"><header class="channel-intro"><span class="channel-emblem">'+icon(r.icon)+'</span><div><h1>'+r.name+'</h1><p>'+r.description+'</p></div><span class="channel-intro-right">独立会话 · 示例频道</span></header><div class="channel-people"><span>参与这件事</span><span class="member-chip">'+logo('codex')+'<strong>Codex</strong><small>协调</small></span><span class="member-chip">'+logo('claude')+'<strong>Claude</strong><small>执行</small></span><span class="member-chip">'+logo('gemini')+'<strong>Gemini</strong><small>检查</small></span>'+btn('setup','+ 管理成员','quiet')+'</div><div class="thread" aria-live="polite"><div class="date-divider">'+(r.id==='video'?'从一个想法到一份交付':r.id==='product'?'保持这件事的上下文':'从这里开始')+' · 示例对话</div>'+r.posts.map(messagePost).join('')+'</div><div class="channel-composer"><div class="channel-prep"><span class="channel-prep-icon">'+icon(connected?'check':'bot')+'</span><div class="channel-prep-text"><strong>'+(connected?'已连接 '+connected+' 位助理（模拟）':'把你的 CLI 团队接到这个频道')+'</strong>'+(connected?'可以发消息，继续体验协作。':'复用已有安装与登录，缺失工具自动准备。')+'</div>'+btn('setup',connected?'连接设置':'一键连接 '+icon('right'),'primary')+'</div>'+channelComposer()+'</div></section>'+rightPanel()+'</div>';}
function switchRoom(id){roomDrafts[roomID]=draft;roomID=id;draft=roomDrafts[id]||'';view='channel';if(state.phase==='chat')state.messages=structuredClone(currentRoom().posts);render();}
function channelRender(){document.getElementById('app').innerHTML=roomNav()+'<main class="main '+(view==='manager'?'manager-view':'')+'"><header class="topbar"><div class="top-title"><span class="hash desktop-channel-title">#</span><span class="desktop-channel-title">'+(view==='manager'?'助理与模型':currentRoom().name)+'</span><select class="channel-mobile-select" aria-label="切换频道">'+rooms.map(r=>'<option value="'+r.id+'" '+(r.id===roomID?'selected':'')+'># '+r.name+'</option>').join('')+'</select><small>'+(view==='manager'?'统一连接，各自独立':'你的 AI 团队协作空间')+'</small></div><div class="top-actions"><span class="prototype-tag">示例工作室</span>'+btn('manager',icon('bot')+'<span>管理助理</span>','')+btn('setup',icon('team')+'<span>频道成员</span>','')+'</div></header><div class="canvas">'+(view==='manager'?manager():channel())+footer()+'</div></main>';renderOverlay();schedule();}
render=channelRender;
enter=function(){if(!ready(state).length){startSetup();return;}if(state.env!=='ready'){toast('本机环境还在准备。');return;}if(state.phase!=='chat'){state=nextState(state,{type:'continue',partial:true});state=nextState(state,{type:'create'});state.messages=structuredClone(currentRoom().posts);}sheet=false;modal='';view='channel';if(queuedDraft){roomID=queuedRoomID;state.messages=structuredClone(currentRoom().posts);if(roomID!=='video')state.turn=Math.max(1,state.turn);state=nextState(state,{type:'send',text:queuedDraft});currentRoom().posts=structuredClone(state.messages);queuedDraft='';draft='';roomDrafts[roomID]='';}render();};
submit=function(){if(!draft.trim())return;if(state.phase==='chat'&&ready(state).length){const msg=draft;draft='';roomDrafts[roomID]='';state.messages=structuredClone(currentRoom().posts);if(roomID!=='video')state.turn=Math.max(1,state.turn);state=nextState(state,{type:'send',text:msg});currentRoom().posts=structuredClone(state.messages);view='channel';render();const thread=document.querySelector('.thread');if(thread)thread.scrollTop=thread.scrollHeight;}else{queuedRoomID=roomID;queuedDraft=draft;startSetup();}};
document.addEventListener('change',e=>{if(e.target.matches('.channel-mobile-select'))switchRoom(e.target.value);});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='room'){e.stopImmediatePropagation();switchRoom(b.dataset.id);}else if(a==='new-chat'||a==='chat'||a==='home'){e.stopImmediatePropagation();view='channel';render();}else if(a==='memory-info'){e.stopImmediatePropagation();toast('频道示例记录：'+currentRoom().memory);}else if(a==='mention'){e.stopImmediatePropagation();draft+='@Claude Code ';roomDrafts[roomID]=draft;render();document.getElementById('draft').focus();}else if(a==='add-room'){e.stopImmediatePropagation();toast('Demo 展示三个独立频道。正式版从这里创建新频道。');}else if(a==='preview-file'){e.stopImmediatePropagation();toast('分镜示例：配置卡点 → 一键连接 → 频道分工 → 汇总交付。');}else if(a==='scene'){rooms.splice(0,rooms.length,...structuredClone(roomSeeds));roomDrafts={video:'',product:'',lobby:''};}else if(a==='manager'){view='manager';}},true);
render();


</script></body></html>
