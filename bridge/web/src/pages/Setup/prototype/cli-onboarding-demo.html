function modalView(){if(modal==='scenes')return '<div class="modal-backdrop" data-dismiss="modal"><section class="modal" role="dialog" aria-modal="true" aria-label="演示设置"><div class="modal-top">'+icon('sliders')+btn('close-modal',icon('close'),'icon-button','aria-label="关闭弹窗"')+'</div><h2>换一种开始方式。</h2><p>体验不同的首次使用情况。切换后仅重置演示状态。</p><div class="scene-options">'+scenes.map(s=>btn('scene','<strong>'+s.name+'</strong><p>'+s.desc+'</p>','scene-option '+(s.id===state.scene?'active':''),'data-id="'+s.id+'"')).join('')+'</div><p class="disclaimer">全部使用示例数据 · 不安装 CLI · 不调用真实模型</p></section></div>';const t=tools.find(v=>v.id===modal);if(!t)return '';return '<div class="modal-backdrop" data-dismiss="modal"><section class="modal" role="dialog" aria-modal="true" aria-label="连接 '+t.name+'"><div class="modal-top">'+logo(t.id)+btn('close-modal',icon('close'),'icon-button','aria-label="关闭弹窗"')+'</div><h2>让 '+t.name+' 加入团队。</h2><p>真实版本会在对应服务的官方流程中完成授权。账号与额度由你掌握。</p><div class="auth-flow"><strong>01</strong> 完成账号授权<br><strong>02</strong> 自动验证连接<br><strong>03</strong> 回到这里，开始协作</div>'+btn('authorize','模拟授权完成 '+icon('right'),'primary','data-id="'+t.id+'"')+'<p class="disclaimer">交互演示，不会跳转真实登录或读取凭据。</p></section></div>';}
function schedule(){clearTimeout(timer);if(state.phase==='setup'&&(state.env==='checking'||state.tools.some(t=>t.selected&&['detecting','queued','installing','verifying'].includes(t.status))))timer=setTimeout(()=>dispatch({type:'advance'}),600);}
function dispatch(a){state=nextState(state,a);if(state.notice){toast(state.notice);state.notice='';}render();}
function startSetup(){if(!state.tools.some(t=>t.selected)){toast('先选择至少一位助理。');return;}if(state.phase==='welcome')state=nextState(state,{type:'start'});sheet=true;render();}
function enter(){if(!ready(state).length){startSetup();return;}if(state.env!=='ready'){toast('本机环境还在准备。');return;}if(state.phase!=='chat'){state=nextState(state,{type:'continue',partial:true});state=nextState(state,{type:'create'});}sheet=false;modal='';view='chat';if(queuedDraft){state=nextState(state,{type:'send',text:queuedDraft});recent=queuedDraft.slice(0,16);queuedDraft='';draft='';}render();}
function addTool(id){const t=state.tools.find(t=>t.id===id);if(t.status==='ready'){t.selected=true;view='home';render();return;}if(state.phase==='welcome'){t.selected=true;startSetup();return;}if(state.phase==='chat'){state.phase='setup';view='home';}t.selected=true;if(['idle','skipped'].includes(t.status))t.status='detecting';sheet=true;render();}
function selectTool(id){const t=state.tools.find(t=>t.id===id);if(state.phase==='welcome'){dispatch({type:'toggle',id});return;}if(t.selected){sheet=true;render();}else addTool(id);}
function submit(){if(!draft.trim())return;if(state.phase==='chat'&&ready(state).length){const msg=draft;draft='';recent=msg.slice(0,16);dispatch({type:'send',text:msg});view='chat';render();}else{queuedDraft=draft;startSetup();}}
document.addEventListener('input',e=>{if(e.target.id==='draft')draft=e.target.value;});
document.addEventListener('submit',e=>{if(e.target.id==='compose'){e.preventDefault();submit();}});
document.addEventListener('keydown',e=>{if(e.target.id==='draft'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}if(e.key==='Escape'){modal='';sheet=false;renderOverlay();}});
document.addEventListener('click',e=>{if(e.target.dataset.dismiss){if(e.target.dataset.dismiss==='modal')modal='';else sheet=false;renderOverlay();return;}const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='home'||a==='manager'||a==='chat'){view=a==='chat'&&state.phase!=='chat'?'home':a;render();}else if(a==='select')selectTool(id);else if(a==='setup')startSetup();else if(a==='enter')enter();else if(a==='close-sheet'){sheet=false;renderOverlay();}else if(a==='close-modal'){modal='';renderOverlay();}else if(a==='scenes'){modal='scenes';renderOverlay();}else if(a==='scene'){clearTimeout(timer);state=initial(id);sheet=false;modal='';view='home';draft='';queuedDraft='';recent='';render();}else if(a==='auth-open'){modal=id;renderOverlay();}else if(a==='authorize'||a==='auth-key'){modal='';dispatch({type:'authorize',id,method:a==='auth-key'?'key':'account'});}else if(a==='retry')dispatch({type:'retry',id});else if(a==='connect-tool')addTool(id);else if(a==='toggle-tool'){const t=state.tools.find(t=>t.id===id);if(t.selected){if(state.tools.filter(t=>t.selected).length===1){toast('至少保留一位助理。');return;}t.selected=false;render();}else addTool(id);}else if(a==='configure'){sheet=true;renderOverlay();}else if(a==='new-chat'){if(state.phase==='chat'){state.messages=state.messages.slice(0,1);state.turn=0;view='chat';recent='';draft='';render();}else{view='home';draft='';render();}}else if(a.startsWith('prompt-')){draft={ 'prompt-video':'一起策划一个 30 秒的项目演示视频，突出一键使用和团队协作。','prompt-code':'把我的想法做成一个能用的产品，先帮我梳理需求与分工。','prompt-research':'帮我研究个人 AI 助理的使用痛点，再让团队交叉审核。'}[a];render();document.getElementById('draft').focus();}else if(a==='team-info'){sheet=true;renderOverlay();}else if(a==='workflow'){toast('协作流程在连接团队后展示。先给团队发一个任务。');}else if(a==='history'){toast(recent?'最近任务：'+recent:'开始一段对话后，任务会出现在这里。');}else if(a==='devices'){toast('本 Demo 只展示本机网页流程，手机连接将在后续接入。');}else if(a==='folder'||a==='attach'){toast('演示使用本机示例工作区，不读取你的文件。');}});
render();

</script></body></html>
