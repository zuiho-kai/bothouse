# Bundle patch applied when this package is listed in a profile's dsh.profile.bundles.
# Channel data follows an isolated <BOTHOUSE_DATA_DIR>/conest-collab; the bridge's own defaults
# (~/.bothouse, ~/.cc-connect) and an unset variable keep ~/.conest-collab, where it already is.
# CONEST_COLLAB_DATA and CONEST_COLLAB_WORKSPACE keep their explicit overrides.
# ~ is os.homedir(), not $HOME: Windows has no HOME, and 'undefined/.conest-collab' stops the plugin loading.
# #1044: each bothouse page is its own row, so the DSH Plugins page switches it on and off.
# Channels is on by default; team desk, bothouse panel and other computers start off.
- insert:
    - id: conest-collab
      name: conest-collab
      config:
        # No ?: here: "!!js (a ? b : c)" is a plain-scalar flow mapping to the YAML parser, so the whole patch
        # failed to load and no role got imported (CI windows-e2e, 11-10). || and a function body parse as one scalar.
        # ~/.bothouse and ~/.cc-connect are the bridge's own defaults, not an isolated directory: a parent that
        # leaves BOTHOUSE_DATA_DIR alone still hands the child that path (openDSHWeb), and the channel data has to
        # stay in ~/.conest-collab, where the previous release and the existing collab.sqlite3 are (no migration).
        dataDir: !!js process.env.CONEST_COLLAB_DATA || ((p, home, raw) => ((d) => (!d || d === p.join(home, '.bothouse') || d === p.join(home, '.cc-connect')) && p.join(home, '.conest-collab') || p.join(d, 'conest-collab'))((raw.trim() && p.normalize(raw.trim().replace(/^~\/?$/, home).replace(/^~\//, home + '/')).replace(/[\/\\]+$/, '')) || ''))(process.getBuiltinModule('node:path'), process.getBuiltinModule('node:os').homedir(), process.env.BOTHOUSE_DATA_DIR || '')
        workspacePath: !!js process.env.CONEST_COLLAB_WORKSPACE || process.cwd()
        leadFile: !!js process.env.CONEST_LEAD_FILE || ((process.env.BOTHOUSE_DATA_DIR || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.bothouse')) + '/lead.json')
        fallbackLead: !!js process.env.CONEST_FALLBACK_LEAD || ''
- insert:
    - id: conest-channels-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-discord'
    - id: bothouse-desk
      name: bothouse-dsh-desk
      disabled: true
    - id: bothouse-panel
      name: bothouse-dsh-panel
      disabled: true
    - id: bothouse-devices
      name: bothouse-dsh-devices
      disabled: true
