<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>团队工作台 · CoNest</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#17131f;--panel:#231d30;--panel2:#1b1626;--ink:#0b0910;--line:#3a3150;--text:#f3ecff;--muted:#a99cc4;--gold:#ffa53a;--teal:#3ddc97;--red:#ff5a5f;--blue:#5fb0ff;--ok:#3ddc97;--px:3px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:#17131f;background-image:radial-gradient(#ffffff0a 1px,transparent 1px);background-size:12px 12px;color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* 像素边框：不用圆角，用四向硬阴影拼出缺角方框 */
.pxbox{background:var(--panel);box-shadow:0 calc(-1*var(--px)) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(-1*var(--px)) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink),0 calc(var(--px)*2) 0 0 #00000055}
.app{margin:0 auto;height:100dvh;box-sizing:border-box;padding:14px 18px 10px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 2px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{width:36px;height:36px;flex:0 0 auto;background:
 linear-gradient(#ffa53a,#ffa53a) 6px 6px/24px 6px no-repeat,
 linear-gradient(#5fb0ff,#5fb0ff) 6px 15px/16px 6px no-repeat,
 linear-gradient(#3ddc97,#3ddc97) 6px 24px/20px 6px no-repeat,#2b2340;box-shadow:0 -3px 0 #0b0910,0 3px 0 #0b0910,-3px 0 0 #0b0910,3px 0 0 #0b0910}
.brand h1{font-size:20px;line-height:1.2;margin:0;letter-spacing:2px;text-shadow:2px 2px 0 #0b0910,0 0 18px #ffa53a55}
.sub{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topright{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.clock{font:700 16px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;color:#ffe9b8;text-shadow:2px 2px 0 #0b0910}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;background:var(--panel2);font-size:12px;color:var(--muted);white-space:nowrap;text-decoration:none;box-shadow:0 -2px 0 #0b0910,0 2px 0 #0b0910,-2px 0 0 #0b0910,2px 0 0 #0b0910}
.pill:before{content:"";width:8px;height:8px;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.live{color:var(--ok)}.pill.wait{color:#e6b450}.pill.err{color:var(--red)}.pill.replay{color:var(--blue)}
.pill.galaxy{color:#c9a7ff}.pill.galaxy:hover{color:#fff}
.badge{font-size:11px;padding:4px 9px;background:#3a2a10;color:#ffd38a;white-space:nowrap;box-shadow:0 0 0 2px #0b0910}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 12px}
.modes{display:flex;gap:4px}
.mode{border:0;background:var(--panel2);color:var(--muted);padding:6px 16px;font-weight:700;font-size:13px;box-shadow:inset 0 -3px 0 #00000055}
.mode.on{background:#ffa53a;color:#241605;box-shadow:inset 0 -3px 0 #b8651a}
.replaybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.field input,.field select{background:var(--panel2);border:2px solid #0b0910;padding:4px 6px;color:var(--text);font-size:12px;color-scheme:dark}
.field input[type=datetime-local]{width:176px}
.presets{display:flex;gap:5px}
.btn{border:0;background:#3a3150;color:#f3ecff;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:inset 0 -3px 0 #00000066,0 0 0 2px #0b0910}
.btn:hover{background:#4a3f66}
.btn.primary{background:#ffa53a;color:#241605;box-shadow:inset 0 -3px 0 #b8651a,0 0 0 2px #0b0910}
.btn:disabled{opacity:.4;cursor:default}
.mini{border:0;background:var(--panel2);color:var(--muted);padding:4px 8px;font-size:11px;box-shadow:0 0 0 2px #0b0910}
.mini:hover{color:var(--text)}
.progress{flex:1 1 90px;min-width:80px;max-width:240px;accent-color:#ffa53a;height:4px}
.vclock{font:700 12px ui-monospace,Menlo,monospace;color:var(--gold);min-width:44px;text-align:right}
.stats{margin-left:auto;font:12px ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:stretch}
.stagewrap{min-width:0;min-height:0;height:100%;display:flex;align-items:flex-start;justify-content:center;}
.stagebox{padding:6px;background:#0b0910;box-shadow:0 6px 0 #00000055}
.stage{position:relative;width:var(--sw,100%);height:var(--sh,auto);aspect-ratio:384/216;overflow:hidden;background:#2a2035;isolation:isolate}
#office{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.seats{position:absolute;inset:0;pointer-events:none;z-index:2}
.seat{position:absolute;left:0;top:0;width:0;height:0}
.stack{position:absolute;left:0;bottom:0;transform:translateX(-50%) scale(var(--k,1));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.label{display:flex;align-items:center;gap:5px;padding:2px 7px;background:#1b1626e6;color:#fff;font-size:11px;font-weight:700;line-height:1.35;box-shadow:0 -2px 0 #0b0910,0 2px 0 #0b0910,-2px 0 0 #0b0910,2px 0 0 #0b0910;pointer-events:auto}
.label .dot{width:6px;height:6px;background:#3ddc97;box-shadow:0 0 6px #3ddc97}
.label .status{color:var(--muted);font-weight:400;font-size:10px}
.seat.working .label .dot{background:#ffa53a;box-shadow:0 0 6px #ffa53a}
.seat.thinking .label .dot{background:#5fb0ff;box-shadow:0 0 6px #5fb0ff}
.seat.offline .label{opacity:.55}.seat.offline .label .dot{background:#6c7380;box-shadow:none}
.seat.lead .label{background:#3a2a10e6;color:#ffe08a}
.seat.walking .label{opacity:.82}
.seat.hold .tasktag{display:none}
.label .name{cursor:text}
.label .many{color:#ffd166;font-weight:800;font-size:10px}
.seat.clone .tasktag{background:#ffcf7a;font-size:10px;padding:1px 6px}
.label .name:hover{text-decoration:underline dotted}
.label input.rename{width:9em;font:inherit;font-size:11px;font-weight:700;color:#fff;background:#0b0910;border:0;outline:1px solid #ffa53a;padding:0 3px;margin:0}
.tasktag{max-width:200px;overflow:hidden;text-overflow:ellipsis;padding:2px 7px;background:#ffa53a;color:#241605;font-size:11px;font-weight:700;box-shadow:0 0 0 2px #0b0910;pointer-events:auto;animation:tagIn .25s steps(3)}
.bubble{display:flex;gap:3px;padding:4px 6px;background:#e9f4ff;box-shadow:0 0 0 2px #0b0910}
.bubble i{width:4px;height:4px;background:#2d5ea3;animation:dotp 1.2s steps(1) infinite}
.bubble i:nth-child(2){animation-delay:.3s}.bubble i:nth-child(3){animation-delay:.6s}
.emote{padding:1px 6px;background:#fff8e6;color:#3a2a10;font-size:11px;box-shadow:0 0 0 2px #0b0910;animation:bob 1.4s steps(2) infinite}
.pop{position:absolute;left:0;bottom:calc(56px*var(--k,1));transform:translateX(-50%);padding:3px 8px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 0 0 2px #0b0910;animation:popUp 1.9s steps(12) forwards;z-index:3}
.pop.good{background:#3ddc97;color:#06281a}.pop.bad{background:#ff5a5f;color:#2a0507}.pop.info{background:#a3acb9;color:#111}.pop.warn{background:#ffd166;color:#3a2a10;font-size:16px;padding:1px 8px}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
@keyframes dotp{0%{opacity:.25}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tagIn{from{transform:scale(.6)}to{transform:scale(1)}}
.side{padding:12px;display:flex;flex-direction:column;min-height:0;max-height:100%;box-sizing:border-box}
.side h2{margin:0 0 10px;font-size:12px;letter-spacing:3px;color:#ffe9b8;display:flex;justify-content:space-between;align-items:center;text-shadow:2px 2px 0 #0b0910}
.count{font:11px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:0}
.log{list-style:none;margin:0;padding:0;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px;min-height:60px}
.log li{padding:6px 8px;background:var(--panel2);box-shadow:inset 3px 0 0 #3a3150;animation:logIn .25s steps(3)}
.log .l1{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.log .t{font:11px ui-monospace,Menlo,monospace;color:#7d7096;flex:0 0 auto}
.log .route{color:#e3d9f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .l2{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes logIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.chip{font-size:10px;padding:1px 6px;font-weight:800;letter-spacing:.4px;flex:0 0 auto}
.chip.created{background:#3a3150;color:#d5c8f0}
.chip.assigned{background:#ffa53a;color:#241605}
.chip.returned{background:#3ddc97;color:#06281a}
.chip.rejected{background:#ff5a5f;color:#2a0507}
.chip.paused{background:#a3acb9;color:#111}
.chip.done{background:#2f9e6e;color:#eafff4}
.chip.at{background:#5fb0ff;color:#06213a}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg:before{content:"";width:8px;height:8px;background:currentColor}
.lg.assign{color:var(--gold)}.lg.return{color:var(--teal)}.lg.reject{color:var(--red)}.lg.at{color:var(--blue)}.lg.pause{color:#a3acb9}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 2px;color:var(--muted);font-size:12px;min-height:20px}
.ticker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.foot-note{flex:0 0 auto;opacity:.65}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:min(560px,92vw);padding:9px 14px;background:#231d30;color:#f3ecff;font-size:12px;box-shadow:0 0 0 3px #0b0910,0 10px 32px #000a;z-index:90}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;letter-spacing:2px;pointer-events:none;text-shadow:2px 2px 0 #0b0910;z-index:3}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
@media (max-width:1180px){.app{height:auto;min-height:100dvh}main{grid-template-columns:minmax(0,1fr)}.stagewrap{height:auto}.side{max-height:360px}}
@media (max-width:900px){.replaybar{flex:1 1 100%;order:3}.field input[type=datetime-local]{width:150px}}
@media (max-width:760px){.app{padding:10px 8px}.sub{display:none}.label .status{display:none}.clock{font-size:13px}}
@media (max-width:420px){.topright .clock{display:none}.brand h1{font-size:16px}}
</style>
</head>

<div class="app">
<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><h1>团队工作台</h1><p class="sub" id="subtitle">每一道像素光，都是一条真实事件</p></div></div>
  <div class="topright"><a class="pill galaxy" href="/collab/wiki-galaxy">Wiki 星河</a><span class="badge fixture" id="fixtureBadge" hidden>示例数据 · 非真实事件</span><span class="clock" id="clockDigital">--:--:--</span><span class="pill wait" id="conn">连接中</span></div>

    <span class="vclock" id="virtualClock">--:--</span>
  </div>
  <div class="stats" id="stats">在线 0/0 · 进行中 0</div>
</section>
<main>

  <section class="stage" id="stage">
    <canvas id="office" width="768" height="432" aria-label="像素办公室"></canvas>

    <div class="legend"><span class="lg assign">派活</span><span class="lg return">交回</span><span class="lg reject">打回</span><span class="lg at">@</span><span class="lg pause">暂停</span></div>
  </aside>
</main>
<footer class="foot"><div class="ticker" id="ticker">等待事件…</div><div class="foot-note">只画真实事件 · 空闲时安静摸鱼</div></footer>
</div>

<script>
// 经面板 /dsh/ 转发时页面挂在前缀下：接口和链接都按当前地址带上前缀，直连时前缀为空。
const ROOT = (location.pathname.match(/^(.*?)\/collab(?:\/|$)/) || ['', ''])[1];
document.querySelectorAll('a[href^="/collab"]').forEach(a => a.setAttribute('href', ROOT + a.getAttribute('href')));
const $ = id => document.getElementById(id);
const q = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const SVG_NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}) => { const n = document.createElementNS(SVG_NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
const norm = v => String(v ?? '').trim().toLowerCase().replace(/[\s\u3000]+/g, '');
const msOf = v => { if (typeof v === 'number') return v < 1e12 ? v * 1000 : v; const n = Date.parse(String(v ?? '')); return Number.isFinite(n) ? n : null; };
const fmtTime = v => { const n = msOf(v); if (n == null) return '--:--'; const d = new Date(n); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const fmtFull = v => { const n = msOf(v); if (n == null) return '--'; const d = new Date(n); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`; };
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const KIND = { created: '新建', assigned: '派活', returned: '交回', rejected: '打回', paused: '暂停', done: '完成', at: '@' };
const PALETTE = ['#e0a458', '#6cb6ff', '#59d3a5', '#c78df2', '#f08a8a', '#78d0d8', '#d9b36c'];
const SHIRTS = ['#3b5270', '#4a3d68', '#2f5d55', '#5a4430', '#3c4f73', '#5a3f52'];
const hashOf = s => [...String(s ?? '')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const colorOf = s => PALETTE[hashOf(s) % PALETTE.length];
const shirtOf = s => SHIRTS[hashOf(s) % SHIRTS.length];

const ROSTER = (() => { try { return JSON.parse($('roster').textContent) ?? { members: [] }; } catch { return { members: [] }; } })();
const FIXTURE = (() => { try { const v = JSON.parse($('fixtureData').textContent); return Array.isArray(v) ? v : []; } catch { return []; } })();
// 仅 ?fixture=1 的演示成员；真实模式一律用 /collab/api/state 的成员。
const DEMO_MEMBERS = [
  { id: "ju", name: "橘", kind: "dsh", avatar: "orange", online: true },
  { id: "longniang", name: "龙娘", kind: "dsh", avatar: "dragon", online: true },
  { id: "jingyu", name: "鲸鱼娘", kind: "bot", avatar: "whale", online: true },
  { id: "caihongmao", name: "彩虹猫", kind: "bot", avatar: "rainbow", online: true },
  { id: "grok", name: "grok娘", kind: "dsh", avatar: "", online: true },
];

const S = {
  me: null, memberList: [], byId: new Map(), alias: new Map(), rosterFor: new Map(), names: {},
  lead: null, active: new Map(), review: new Map(), cloneNodes: new Map(), thinkingRooms: new Map(), thinking: new Set(), dispatched: new Set(),
  fixture: false, mode: 'live', eventCount: 0, logLimit: 80,
  replay: { events: [], idx: 0, timer: null, playing: false, speed: 4, loaded: false, auto: false },
};

function matchRoster(m) {
  const id = norm(m.id), name = norm(m.name);
  for (const rm of ROSTER.members ?? []) {
    const cand = [rm.project, rm.name, ...(rm.aliases ?? [])];
    if (cand.some(k => norm(k) === id || norm(k) === name)) return rm;
  }
  return undefined;
}

function indexMembers(list) {
  S.memberList = (Array.isArray(list) ? list : []).filter(m => m && m.kind !== 'human' && m.id);
  S.byId = new Map(); S.alias = new Map(); S.rosterFor = new Map();
  for (const m of S.memberList) {
    S.byId.set(m.id, m);
    const rm = matchRoster(m);
    S.rosterFor.set(m.id, rm);
    for (const k of [m.id, m.name, rm?.project, rm?.name, ...(rm?.aliases ?? [])]) if (k) S.alias.set(norm(k), m);
  }
  for (const id of [...S.active.keys()]) if (!S.byId.has(id)) S.active.delete(id);
}

function resolveRef(ref) {
  const raw = String(ref ?? '').trim();
  if (!raw) return null;
  const direct = S.alias.get(norm(raw));
  if (direct) return direct;
  let s = raw.replace(/（[^）]*）|\([^)]*\)/g, '').replace(/工作区\s*\d*/g, '');
  for (const part of s.split(/[；;\/、,，]+/)) {

function deskLayout(n) {
  const rows = n <= 4 ? 1 : 2;
  const ys = rows === 1 ? [104] : [84, 150];
  const cols = Math.ceil(n / rows);
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = Math.min(cols, n - r * cols);
    const span = 250, x0 = 66;

// ── 角色行为 ──
// 座位在桌子后面，人面朝我们坐；进出都从桌子侧面绕，不穿桌子。

      if (a.target === 'desk') { if (busy || REDUCED) { a.state = 'sit'; a.timer = 0.8 + Math.random() * 1.2; } else wander(a); }

  }

function drawBeams(ctx, now, dt) {

      const s = e - i * (b.kind === 'assign' ? 0.012 : 0.018);

}

function updateClone(a, dt) {

  if (a.react && performance.now() - a.react.t0 > 900) a.react = null;
  if (a.state === 'spawn') {
    a.timer -= dt;
    if (a.timer <= 0) { a.carry = 'chair'; a.target = 'slot'; a.path = findPath(a.x, a.y, a.slot.x, a.slot.y); a.state = 'walk'; a.run = false; }
    return;
  }
  if (a.state === 'walk') {
    let step = (a.leaving ? 18 : 26) * dt;
    while (step > 0 && a.path.length) {
      const p = a.path[0], dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
      if (Math.abs(dx) > Math.abs(dy)) a.view = dx > 0 ? 'right' : 'left'; else if (d > 0.01) a.view = dy > 0 ? 'front' : 'back';
      if (d <= step) { a.x = p.x; a.y = p.y; a.path.shift(); step -= d; } else { a.x += dx / d * step; a.y += dy / d * step; step = 0; }
    }
    a.ft += dt;
    if (!a.path.length) {
      // 走到本人身边，把文件递过去停一下，再「噗」地消失。
      if (a.target === 'home') { a.state = 'handin'; a.timer = 0.7; a.view = a.x >= seatPoint(a.desk).x ? 'left' : 'right'; return; }
      a.state = 'sit'; a.carry = null; a.x = a.slot.x; a.y = a.slot.y;
      const s = P.stations.get(a.id);
      if (s && !s.up) { s.up = true; puff(s.x, s.y - 30); }
    }
    return;
  }
  if (a.state === 'handin') { a.timer -= dt; if (a.timer <= 0) { puff(a.x, a.y - 16); removeClone(a); } return; }
  if (a.state === 'sit') a.view = 'front';
}

function startRename(m, label, name) {
  if (q('input.rename', label)) return;
  const input = document.createElement('input');
  input.className = 'rename';
  input.maxLength = 24;
  input.value = S.names[m.id] || displayName(m);
  input.placeholder = S.rosterFor.get(m.id)?.name || m.name || m.id;
  name.hidden = true;
  name.after(input);
  input.focus(); input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const value = input.value.replace(/\s+/g, ' ').trim();
    input.remove(); name.hidden = false;
    if (!save || value === displayName(m)) return;
    const prev = S.names[m.id];
    if (value) S.names[m.id] = value; else delete S.names[m.id];
    paintAll();
    if (S.fixture) return;
    try {
      const body = await api(ROOT + '/collab/api/desk/names', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: m.id, name: value }) });
      S.names = body.names ?? S.names;
    } catch (error) {
      if (prev) S.names[m.id] = prev; else delete S.names[m.id];
      toast('改名没存上：' + error.message);
    }
    paintAll();
  };
  input.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(true);
  input.onclick = (e) => e.stopPropagation();
}

async function loadNames() {

}

function rosterRank(m) {
  const at = (ROSTER.members ?? []).indexOf(S.rosterFor.get(m.id));
  return at < 0 ? 99 : at;
}
function orderedMembers() {
  const list = [...S.memberList];
  list.sort((a, b) => rosterRank(a) - rosterRank(b) || displayName(a).localeCompare(displayName(b), 'zh'));
  const lead = S.lead ? S.byId.get(S.lead) : undefined;
  if (lead) {
    const at = list.indexOf(lead);
    if (at > 0) { list.splice(at, 1); list.unshift(lead); }
  }
  return list;
}

function renderSeats() {
  const order = orderedMembers();
  const spots = deskLayout(order.length);
  P.desks = new Map(order.map((m, i) => [m.id, { id: m.id, ...spots[i] }]));
  buildGrid();
  P.poiUsed.clear();
  dropClones();
  for (const id of [...P.agents.keys()]) if (!P.desks.has(id)) P.agents.delete(id);
  for (const m of order) { const a = agentFor(m, P.desks.get(m.id)); a.poi = null; if (a.state === 'stay' || a.state === 'walk') goDesk(a, false); }
  const nodes = order.map(seatNode);
  S.seatNodes = new Map(order.map((m, i) => [m.id, nodes[i]]));

function paintSeat(m) {
  const node = S.seatNodes?.get(m.id);
  if (!node) return;
  const a = P.agents.get(m.id);
  const tasks = S.active.get(m.id);
  // 本人名下那件；本人那件交了、分身还在干时，本人也算在干活（坐在工位上），只是头顶不挂任务。
  const rec = a?.taskKey ? tasks?.get(a.taskKey) : null;
  const thinking = S.thinking.has(m.id);
  const online = m.online !== false;
  const kind = !online ? 'off' : tasks?.size ? 'work' : thinking ? 'think' : 'idle';
  if (a) a.mode = kind;
  for (const k of ['off', 'work', 'think', 'idle']) node.classList.toggle(k === 'off' ? 'offline' : k === 'work' ? 'working' : k === 'think' ? 'thinking' : 'idle', kind === k);
  node.classList.toggle('lead', S.lead === m.id);
  const tag = q('.tasktag', node);
  if (rec) {
    tag.hidden = false;
    tag.textContent = `#${rec.id || '?'} ${rec.title || ''}`.trim();
    tag.title = `${rec.title || ''}${rec.note ? ' · ' + rec.note : ''}`;
  } else { tag.hidden = true; tag.title = ''; }
  const statusText = !online ? '离线' : kind === 'work' ? '干活中' : thinking ? '思考中' : '摸鱼中';
  q('.status', node).textContent = statusText;
  const many = q('.many', node), total = tasks?.size ?? 0;
  const shown = total > 0 && online ? 1 + cloneList(m.id).filter(c => !c.leaving).length : 0;
  many.hidden = !(total > shown);
  many.textContent = total > shown ? `×${total}` : '';
  many.title = total > shown ? `同时 ${total} 件在跑，画面上只放得下 ${shown} 个小人` : '';
  q('.name', node).textContent = displayName(m);
  const bubble = q('.bubble', node);
  bubble.hidden = kind !== 'think';
  if (kind === 'think' && !bubble.children.length) for (let i = 0; i < 3; i++) bubble.append(el('i'));
  node.title = `${displayName(m)} · ${statusText}`;
}

function beam(from, to, kind = 'assign') {
  if (!from || !to || from.id === to.id) return false;
  if (!P.agents.has(from.id) || !P.agents.has(to.id)) return false;
  // @ 是一颗细小光点沿虚线拖尾飞过；派活是一封小信，交回/打回是方块光球。
  P.beams.push({ from: from.id, to: to.id, kind, t0: performance.now(), dur: kind === 'at' ? 800 : kind === 'assign' ? 1800 : 1000 });
  return true;
}

function fitStage() {
  const wrap = $('stagewrap'), stage = $('stage');
  if (!wrap || !stage) return;
  const box = wrap.firstElementChild, pad = box ? box.offsetWidth - box.clientWidth + 12 : 12;
  const availW = wrap.clientWidth - pad;
  const stacked = matchMedia('(max-width:1180px)').matches;
  const availH = stacked ? innerHeight - wrap.getBoundingClientRect().top - scrollY - pad - 8 : wrap.clientHeight - pad;
  let w = Math.max(240, Math.min(availW, availH * PX.W / PX.H));
  w = Math.floor(w);
  stage.style.setProperty('--sw', w + 'px');
  stage.style.setProperty('--sh', Math.round(w * PX.H / PX.W) + 'px');
  stage.style.setProperty('--k', Math.min(2.2, Math.max(0.9, w / 1000)).toFixed(3));
}

/**
 * 事件契约（真实 A 路）：from 是派活人，to 是干活人。
 * 回传光只在绘制处反向一次：beam(worker, dispatcher)。这里不再做第二次方向猜测。
 * active 记录只在 to 缺失时兜底，不覆盖事件里的 to。
 */
function workerAndDispatcher(rec, from, to) {
  const worker = to || (rec ? S.byId.get(rec.memberId) : null);
  return { worker, dispatcher: from };
}

// S.active：成员 id → (任务键 → 记录)。同一个人可以同时有几件活在跑，每件一个小人（本人 + 分身）。
const taskKeyOf = (memberId, taskId) => taskId ? String(taskId) : `_${memberId}`;
function activeCount() { let n = 0; for (const map of S.active.values()) for (const rec of map.values()) if (!rec.paused) n++; return n; }
function setTask(member, rec) {
  const key = taskKeyOf(member.id, rec.id);
  if (rec.id) for (const [memberId, map] of S.active) if (memberId !== member.id && map.delete(key) && !map.size) S.active.delete(memberId);
  let map = S.active.get(member.id);
  if (!map) S.active.set(member.id, (map = new Map()));
  map.set(key, { ...rec, memberId: member.id });
}
function clearTask(memberId, taskId) {
  const map = S.active.get(memberId);
  if (!map) return;
  map.delete(taskKeyOf(memberId, taskId));
  if (!map.size) S.active.delete(memberId);
}
function findActive(taskId) {
  if (!taskId) return null;
  for (const [memberId, map] of S.active) { const rec = map.get(String(taskId)); if (rec) return { ...rec, memberId }; }
  return null;
}

// <dispatch-model>
/** 同一次派活的稳定键：taskId>memberId。 */
function dispatchKey(id, toId) { return `${id}>${toId}`; }
/** 只有本次派活周期内没画过才放行。 */
function dispatchAllowed(id, toId, dispatched) {
  return !!id && !!toId && !dispatched.has(dispatchKey(id, toId));
}
/** 结束本次派活：清掉该任务的所有去重键，交回/打回后再派同一个人仍会画光。 */
function forgetDispatch(id, dispatched) {
  if (!id) return;
  const prefix = id + '>';
  for (const key of [...dispatched]) if (key.startsWith(prefix)) dispatched.delete(key);
}
// </dispatch-model>

function dispatchBeamOnce(id, from, to) {
  if (!dispatchAllowed(id, to.id, S.dispatched)) return;
  S.dispatched.add(dispatchKey(id, to.id));
  const body = bodyRef(to.id, id);
  if (beam(from, body, 'assign')) { const g = P.agents.get(body.id); if (g) g.hold = true; }
}

function applyTask(ev, animate = true, quiet = false) {
  // 实时流上 tasks.mjs 也发 `{type:'task', task:{…}, chat_id, active}`（给聊天面板用的任务对象），
  // 那不是板事件的形态（id/kind/from/to/title，由 gate 的 board.py 写进 board-events.jsonl）。
  // 两种都照画，任务动作会多出一行「— → —」的空记录，实时就和回放对不上了。
  if (ev.task && typeof ev.task === 'object') return;
  const id = String(ev.id ?? '');
  const kind = String(ev.kind ?? '');
  const from = resolveRef(ev.from);
  const to = resolveRef(ev.to);
  const title = String(ev.title ?? '');
  const note = String(ev.note ?? '');
  const ts = ev.ts ?? Date.now();
  const ms = evMs(ev);
  const fromName = from ? displayName(from) : (ev.from || '—');
  const toName = to ? displayName(to) : (ev.to || '—');
  const header = id ? `#${id} ${title}`.trim() : title;

  if (id) {
    if (kind === 'returned') { const w = to || (findActive(id) ? S.byId.get(findActive(id).memberId) : null); S.review.set(id, { color: w ? styleOf(w).hair : '#c9ced6', t: ms }); }
    else S.review.delete(id);
  }
  if (kind === 'created' || kind === 'assigned') {
    if (to) {
      const prev = findActive(id);
      setTask(to, { id, title: title || prev?.title || '', note: note || prev?.note || '', from: from?.id ?? prev?.from ?? null, to: to.id, t: prev?.t ?? ms, seen: ms });
      paintAll(animate);
      if (kind === 'created' && from && animate) dispatchBeamOnce(id, from, to);
      if (kind === 'assigned' && from && animate) dispatchBeamOnce(id, from, to);
      if (animate) flashSeat(bodyRef(to.id, id).id, 'flash-gold');
    }
  } else if (kind === 'returned' || kind === 'rejected') {
    const rec = findActive(id);
    const { worker, dispatcher } = workerAndDispatcher(rec, from, to);
    if (kind === 'returned') {
      // 先取干活的那个小人（分身交回时是分身），再清任务：分身抱着文件走回本人工位后消失。
      const body = worker ? bodyRef(worker.id, id) : null;
      if (worker && dispatcher && animate) beam(body, dispatcher, 'return');
      if (worker) {
        if (animate) boardDone(worker.id, id);
        clearTask(worker.id, id);
        paintAll(animate);
        if (animate) { flashSeat(body.id, 'flash-good'); deskPop(body.id, '✓ 交回', 'good'); }
      }
      forgetDispatch(id, S.dispatched);
    } else {
      // 打回 = 回去返工：这件重新算在跑，干它的小人（分身也一样）抖一下继续坐着干。
      if (worker) { setTask(worker, { id, title: title || rec?.title || '', note, from: dispatcher?.id ?? rec?.from ?? null, to: worker.id, t: rec?.t ?? ms, seen: ms }); paintAll(animate); }
      const body = worker ? bodyRef(worker.id, id) : null;
      if (worker && animate) { const thrower = dispatcher || (S.lead ? { id: S.lead } : null); throwBall(thrower, body, `✕ 打回${note ? '：' + note : ''}`); }
      forgetDispatch(id, S.dispatched);
    }
  } else if (kind === 'paused') {
    const rec = findActive(id);
    const { worker } = workerAndDispatcher(rec, from, to);
    if (worker) {
      setTask(worker, { id, title: title || rec?.title || '', note, from: rec?.from ?? from?.id ?? null, to: worker.id, t: rec?.t ?? ms, seen: ms, paused: true });
      paintAll(animate);
      if (animate) deskPop(bodyRef(worker.id, id).id, `暂停${note ? '：' + note : ''}`, 'info');
    }
    forgetDispatch(id, S.dispatched);
  } else if (kind === 'done') {
    const { worker } = workerAndDispatcher(findActive(id), from, to);
    if (worker) {
      const body = bodyRef(worker.id, id);
      if (animate && kind === 'done') boardDone(worker.id, id);
      clearTask(worker.id, id);
      paintAll(animate);
      if (animate) { flashSeat(body.id, 'flash-good'); deskPop(body.id, '✓ 完成', 'good'); }
    }
    forgetDispatch(id, S.dispatched);
  }
  if (!quiet) addLog(kind, ts, fromName, toName, header, note);
  paintAll(animate);
}

function applyMessage(ev, animate = true) {
  const message = ev.message ?? ev;
  const text = String(message.text ?? '');
  if (!text || message.author_kind === 'user' || message.author_kind === 'human') return;
  const author = S.byId.get(message.author) || resolveRef(message.name) || resolveRef(message.author);
  if (!author) return;
  const targets = new Set();
  // #876 P: 回放接口直接给被 @ 的成员 id；实时事件没有这个字段，就按 hub 的同一套规则
  // （mentions.mjs）从文本认：``` 代码块里的不算，多个名字重叠时最长优先。
  if (Array.isArray(message.mentions)) {
    for (const id of message.mentions) {
      const other = S.byId.get(id);
      if (other && other.id !== author.id) targets.add(other);
    }
  } else {
    const outside = text.split('```').filter((_, i) => i % 2 === 0).join(' ');
    const pairs = [];
    for (const other of S.memberList) {
      if (other.id === author.id) continue;
      const rm = S.rosterFor.get(other.id);
      for (const n of [other.name, other.id, rm?.name, ...(rm?.aliases ?? [])].filter(Boolean)) pairs.push(['@' + n, other]);
    }
    pairs.sort((a, b) => b[0].length - a[0].length);
    // 逐位扫描、命中即跳过整段，和 mentions.mjs 的 matchAll(最长优先) 等价：
    // 否则 "@阿柚子" 会同时命中 "@阿柚子" 和 "@阿柚" 两个名字。
    for (let i = 0; i < outside.length;) {
      const hit = pairs.find(([alias]) => outside.startsWith(alias, i));
      if (hit === undefined) { i += 1; continue; }
      targets.add(hit[1]);
      i += hit[0].length;
    }
  }
  // 干活的人在频道里说话也算一次真实动静：飘一张进度纸条回主角色桌
  if (animate) slipFrom(author.id);
  if (!targets.size) return;
  if (animate) for (const target of targets) beam(author, target, 'at');
  const ts = ev.ts ?? (message.created_at ? message.created_at * 1000 : Date.now());
  addLog('at', ts, displayName(author), [...targets].map(displayName).join('、'), text.slice(0, 70), '');
}

function applyEvent(ev, animate = true) {
  if (!ev || typeof ev !== 'object') return;
  if (ev.type === 'task') applyTask(ev, animate);
  else if (ev.type === 'thinking') applyThinking(ev);
  else if (ev.type === 'message') applyMessage(ev, animate);
  else if (ev.type === 'members') setMembers(ev.members);
  else if (ev.type === 'lead') setLead(ev.effective_lead_id ?? ev.lead_id);
}
S.logLimit = S.logLimit || 80;

async function api(path, init = {}) {
  const res = await fetch(path, { credentials: 'same-origin', cache: 'no-store', ...init });
  if (!res.ok) {
    let message = res.statusText;
    try { const body = await res.json(); message = body.error || message; } catch { /* not JSON */ }
    throw new Error(`${message} (${res.status})`);
  }
  return res.json();
}

function setConn(kind, text) {
  const pill = $('conn');
  pill.classList.remove('live', 'wait', 'err', 'replay');
  if (kind) pill.classList.add(kind);
  pill.textContent = text;
}

function disconnectLive() {
  if (S.es) { S.es.close(); S.es = null; }
}

async function loadState() {
  const [state] = await Promise.all([api(ROOT + '/collab/api/state'), loadNames()]);
  S.me = state.me ?? null;
  indexMembers(state.members ?? []);
  const lead = state.effective_lead_id ?? state.lead_id ?? null;
  S.lead = lead && S.byId.has(lead) ? lead : null;
  setThinkingRooms(state.thinking ?? {});
  renderSeats();
}

// 刷新/第一次打开时进行中的任务要从板上补回来，否则工位和「进行中」要等下一个事件才对。
async function loadDeskState() {
  const data = await api(ROOT + '/collab/api/desk/state');
  for (const ev of data.tasks ?? []) applyTask({ ...ev, type: 'task' }, false, true);
  for (const ev of data.returned ?? []) applyTask({ ...ev, type: 'task' }, false, true);
  for (const ev of data.paused ?? []) applyTask({ ...ev, type: 'task' }, false, true);
}

function connectLive() {
  disconnectLive();
  const es = new EventSource(ROOT + '/collab/api/events');
  S.es = es;
  es.onopen = () => { if (S.es === es && S.mode === 'live') setConn('live', '实时已连接'); };
  es.onmessage = (message) => {
    // 已切回放或已换连接时，忽略在途回调，避免历史场景混入实时事件。
    if (S.es !== es || S.mode !== 'live') return;
    try { applyEvent(JSON.parse(message.data), true); } catch (error) { console.warn('desk event', error); }
  };
  es.onerror = () => { if (S.es === es && S.mode === 'live') setConn('wait', '重连中…'); };
}

function resetScene(clearLog = true) {
  stopReplayTimer();
  S.active.clear();
  S.review.clear();
  P.slips = [];
  P.balls = [];
  S.thinkingRooms.clear();
  S.thinking.clear();
  S.dispatched.clear();
  P.beams = []; P.parts = [];
  dropClones();
  for (const node of S.seatNodes?.values() ?? []) for (const pop of node.querySelectorAll('.pop')) pop.remove();
  if (clearLog) {
    $('eventLog').replaceChildren();
    S.eventCount = 0;
    $('eventCount').textContent = '0';
    $('ticker').textContent = '等待事件…';
  }
  paintAll();
}

function setModeUI(mode) {
  S.mode = mode;
  const live = mode === 'live';
  $('modeLive').classList.toggle('on', live);
  $('modeReplay').classList.toggle('on', !live);
  $('modeLive').setAttribute('aria-selected', String(live));
  $('modeReplay').setAttribute('aria-selected', String(!live));
  $('replayBar').hidden = live;
  if (!live) { disconnectLive(); setConn('replay', '回放模式'); }
}

async function goLive() {
  disconnectLive();
  stopReplay();
  S.fixture = false;
  $('fixtureBadge').hidden = true;
  resetScene();
  setModeUI('live');
  setConn('wait', '连接中');
  try {
    await loadState();
  } catch (error) {
    setConn('err', '连接失败');
    toast(`加载失败：${error.message}`);
    return;
  }
  try {
    await loadDeskState();
  } catch { /* 进行中的任务补不回来，不影响实时事件 */ }
  connectLive();
}
const R = (S.replay = { events: [], idx: 0, playing: false, speed: 4, timer: null, loaded: false });

function toLocalInput(date) {
  const p = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
}

function setDefaultRange() {
  const now = new Date();
  $('to').value = toLocalInput(now);
  $('from').value = toLocalInput(new Date(now.getTime() - 2 * 3600e3));
}

function setRangePreset(name) {
  const now = new Date();
  if (name === '1h') {
    $('to').value = toLocalInput(now);
    $('from').value = toLocalInput(new Date(now.getTime() - 3600e3));
  } else if (name === 'tonight') {
    const from = new Date(now); from.setDate(from.getDate() - 1); from.setHours(20, 0, 0, 0);
    const to = new Date(now); to.setHours(8, 0, 0, 0);
    $('from').value = toLocalInput(from); $('to').value = toLocalInput(to);
  }
}

function eventMs(ev) {
  if (ev.type === 'message') {
    const message = ev.message ?? ev;
    if (typeof message.created_at === 'number') return message.created_at * 1000;
  }
  const raw = ev.ts ?? ev.created_at;
  if (typeof raw === 'number') return raw > 1e12 ? raw : raw * 1000;
  const ms = Date.parse(raw);
  return Number.isFinite(ms) ? ms : NaN;
}

function normalizeReplay(data) {
  let list = Array.isArray(data) ? data : data?.events ?? data?.items ?? [];
  if (!Array.isArray(list)) list = [];
  if (!list.length && (Array.isArray(data?.board) || Array.isArray(data?.messages))) {
    list = [...(data.board ?? []).map(e => ({ ...e, type: 'task' })), ...(data.messages ?? []).map(m => ({ type: 'message', message: m }))];
  }
  return list
    .map(ev => {
      if (!ev || typeof ev !== 'object') return null;
      const out = ev.type === 'task' || ev.kind ? { ...ev, type: 'task' } : ev;
      const ms = eventMs(out);
      return Number.isFinite(ms) ? { ...out, _ms: ms } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a._ms - b._ms);
}

function stopReplayTimer() {
  if (R.timer) clearTimeout(R.timer);
  R.timer = null;
}
function pauseReplay() {
  R.playing = false;
  stopReplayTimer();
  const button = $('playPause');
  if (button) { button.textContent = '▶'; button.setAttribute('aria-label', '播放'); }
}
function stopReplay() {
  pauseReplay();
  R.events = []; R.idx = 0; R.loaded = false;
}

function updateReplayUI() {
  $('playPause').disabled = !R.loaded || !R.events.length;
  $('playPause').textContent = R.playing ? '⏸' : '▶';
  $('playPause').setAttribute('aria-label', R.playing ? '暂停' : '播放');
  $('progress').disabled = !R.loaded || !R.events.length;
  $('progress').max = String(Math.max(1, R.events.length));
  $('progress').value = String(R.idx);
  if (R.events.length) $('virtualClock').textContent = fmtTime(R.events[R.idx > 0 ? R.idx - 1 : 0]._ms);
  else $('virtualClock').textContent = '--:--';
}

function setReplayEvents(events) {
  R.events = events;
  R.idx = 0;
  R.loaded = true;
  R.playing = false;
  stopReplayTimer();
  updateReplayUI();
  if (!events.length) {
    $('virtualClock').textContent = '--:--';
    toast('这个时间段没有记录的事件');
  }
}

function stepReplay() {
  if (!R.playing) return;
  const ev = R.events[R.idx];
  if (!ev) { pauseReplay(); return; }
  applyEvent(ev, true);
  R.idx += 1;
  updateReplayUI();
  if (R.idx >= R.events.length) {
    pauseReplay();
    toast('回放结束');
    return;
  }
  const gap = Math.min(2400, Math.max(350, R.events[R.idx]._ms - ev._ms)) / R.speed;
  R.timer = setTimeout(stepReplay, gap);
}

function startReplay() {
  if (!R.events.length) return;
  if (R.idx >= R.events.length) {
    resetScene(true);
    R.idx = 0;
  }
  R.playing = true;
  updateReplayUI();
  stepReplay();
}

function toggleReplay() {
  if (R.playing) pauseReplay(); else startReplay();
  updateReplayUI();
}

function seekReplay(value) {
  const target = Math.max(0, Math.min(R.events.length, Number(value)));
  const was = R.playing;
  pauseReplay();
  resetScene(true);
  for (let i = 0; i < target; i++) applyEvent(R.events[i], false);
  R.idx = target;
  updateReplayUI();
  if (was) startReplay();
}

async function loadReplayWindow(auto = false) {
  setModeUI('replay');
  pauseReplay();
  const from = Date.parse($('from').value);
  const to = Date.parse($('to').value);
  if (!Number.isFinite(from) || !Number.isFinite(to) || to < from) { toast('请选择有效的时间段'); return; }
  resetScene(true);
  setReplayEvents([]);
  try {
    const query = `from=${encodeURIComponent(new Date(from).toISOString())}&to=${encodeURIComponent(new Date(to).toISOString())}`;
    const data = await api(ROOT + '/collab/api/desk/replay?' + query);
    setReplayEvents(normalizeReplay(data));
    if (auto && R.events.length) startReplay();
  } catch (error) {
    toast(`回放载入失败：${error.message}`);
    updateReplayUI();
  }
}

async function loadFixture() {
  S.fixture = true;
  $('fixtureBadge').hidden = false;
  setModeUI('replay');
  // B 路的 desk 路由只内联 index.html，不服务同目录文件；fixture 必须内联读取。
  let lines = [];
  try { lines = JSON.parse($('fixtureData').textContent || '[]'); } catch { lines = []; }
  const events = [];
  for (const line of lines) {
    try { events.push(typeof line === 'string' ? JSON.parse(line) : line); } catch { /* skip bad sample line */ }
  }
  const membersEvent = events.find(ev => ev.type === 'members' && Array.isArray(ev.members));
  indexMembers(membersEvent ? membersEvent.members : DEMO_MEMBERS);
  S.lead = S.memberList[0]?.id ?? null;
  renderSeats();
  setThinkingRooms({});
  setReplayEvents(normalizeReplay(events.filter(ev => ev.type !== 'members')));
  const params = new URLSearchParams(location.search);
  if (params.get('autoplay') === '1' && R.events.length) setTimeout(startReplay, 500);
}
function tickClock() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('clockDigital').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function wireUI() {
  $('modeLive').onclick = () => { goLive(); };
  $('modeReplay').onclick = () => { pauseReplay(); setModeUI('replay'); };
  $('loadReplay').onclick = () => { loadReplayWindow(true); };
  $('playPause').onclick = () => { toggleReplay(); };
  $('speed').onchange = () => { R.speed = Number($('speed').value) || 4; };
  // 进度条按事件条数定位；拖动后立刻重建场景，不等计时器。
  $('progress').oninput = () => { seekReplay($('progress').value); };
  for (const button of document.querySelectorAll('[data-range]')) button.onclick = () => setRangePreset(button.dataset.range);
}

async function boot() {
  setDefaultRange();
  wireUI();
  tickClock();
  setInterval(tickClock, 1000);
  startOffice();
  const params = new URLSearchParams(location.search);
  if (params.get('fixture') === '1') { await loadFixture(); return; }
  const from = params.get('from'), to = params.get('to');
  if (from && to) {
    const f = Date.parse(from), t = Date.parse(to);
    if (Number.isFinite(f) && Number.isFinite(t)) {
      // 时间窗入口直接进回放：先断开实时，再载入历史，避免边连边混。
      setModeUI('replay');
      $('from').value = toLocalInput(new Date(f));
      $('to').value = toLocalInput(new Date(t));
      try { await loadState(); } catch (error) { setConn('err', '状态加载失败'); }
      await loadReplayWindow(false);
      return;
    }
  }
  await goLive();
}

boot();

</script>
