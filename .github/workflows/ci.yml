name: CoNest checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Python steps and Go tests run scripts inside the source tree; a __pycache__ left under an embedded
# directory (bridge/contrib/lead/*) breaks the next go build/vet/test in the same job.
env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: conest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.paths.outputs.go }}
      companion: ${{ steps.paths.outputs.companion }}
      dsh: ${{ steps.paths.outputs.dsh }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      # Run candidate policy tests with read-only permissions on hosted runners.
      # The decision below reads policy separately from the immutable PR base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .policy
          persist-credentials: false
      - run: node --test .github/ci/*.test.cjs
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: paths
        with:
          script: |
            // Read the single classifier from the immutable PR base. On initial
            // adoption the base has no classifier, so run everything.
            const full = () => ({ go: true, companion: true, dsh: true, docs_only: false });
            let classify = full;
            if (context.eventName === 'pull_request') {
              try {
                classify = require(`${process.env.GITHUB_WORKSPACE}/.policy/.github/ci/classify.cjs`).classify;
              } catch (error) {
                if (error.code !== 'MODULE_NOT_FOUND') throw error;
                core.info('No base classifier yet; retaining full coverage');
              }
            }
            let paths = [];
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.issue.number, per_page: 100
              });
              // GitHub caps this API at 3000 files. Incomplete lists run everything.
              if (files.length === context.payload.pull_request.changed_files) {
                paths = files;
              }
            }
            const result = classify(paths, context.eventName);
            for (const [key, value] of Object.entries(result)) core.setOutput(key, String(value));
            core.info(JSON.stringify(result));

  companion:
    # GitHub-hosted runners are free for this public repository; self-hosted runners are kept for the
    # macOS release build only, so releases no longer queue behind PR checks.
    # companion-fork below runs the same steps for fork PRs; both names are required checks on main.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.changes.result != 'success' || needs.changes.outputs.companion == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - run: node --version
      - run: node --test tests/test_voice_player.cjs

  # Bridge checks run on GitHub-hosted runners for both same-repo and fork PRs. The work is split into
  # bridge-checks (Node/Python/vitest, builds, vet) and bridge-go (Go tests in parallel shards); the
  # required check names bridge and bridge-fork are summary jobs over them.
  bridge-checks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsh == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # fail open: if the changes job failed its outputs are empty and the Go steps still run
      RUN_GO: ${{ needs.changes.outputs.go != 'false' }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Go is set up for dsh-only PRs too: the embedded client bundle check below is a Go test.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      # node with zlib zstd (what DSH itself needs: dsh-session-persistence-jsonl imports zstdCompress from
      # node:zlib), so the zstd session-log tests in contrib/hooks run instead of being skipped
      # Steps below keep going after an earlier one fails (but not when the run is cancelled), so one red
      # test file no longer hides every later check.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh/package-lock.json
      - run: node --test ../integrations/dsh-public-output/*.test.mjs
        if: ${{ !cancelled() }}
      - run: node --test ../integrations/dsh-acp-subtasks/*.test.mjs
        if: ${{ !cancelled() }}
      # collab imports @agentclientprotocol/sdk; install from the committed lockfile like dsh/install.sh does
      - run: npx -y pnpm@10 install --frozen-lockfile
        if: ${{ !cancelled() }}
        working-directory: dsh/collab
      - run: node --test ../dsh/collab/*.test.mjs
        if: ${{ !cancelled() }}
      - run: python3 -I contrib/hooks/test_hooks.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_dshlog.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_bash_guard_longwait.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_workflow_clis.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_eta_guard.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_codemap_inject.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_codemap_fill.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      # dsh/scripts: the web host restart writes ~/.bothouse/dsh-web.json back (a stale pid/token
      # there is what made the panel answer 503); it runs on macOS with ps/lsof, so its own tests
      # use a fake host and skip on runners without them.
      - run: python3 -I ../dsh/scripts/test_reload_web.py
        if: ${{ !cancelled() }}
      - run: python3 -I contrib/wiki/test_rolewiki.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/hooks/test_global_hooks.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/tools/test_watchvid_adapters.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/routine/test_newsdigest.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      # gate tests read config.toml with tomllib (3.11+) and skip below it; pin 3.11 here, after the steps above,
      # so they actually run and the earlier python3 steps keep the runner's own interpreter
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
        with:
          python-version: '3.11'
      - run: python3 -I contrib/gate/test_ctxsvc.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_gate_context.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_gate_addressee.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_lead_playbook.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_datadir.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I -m unittest discover -s contrib/qq-gate -p 'test_*.py' -v
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_board.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_board_prune.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_sync_gate_modules.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_memory_forum.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - run: python3 -I contrib/gate/test_score_night.py
        if: ${{ !cancelled() && env.RUN_GO == 'true' }}
      - name: Install channel test dependencies
        if: ${{ !cancelled() }}
        working-directory: .
        # Keep each job's tools isolated, and install the committed dependency tree.
        run: |
          test_tools=$(mktemp -d "$RUNNER_TEMP/conest-vitest.XXXXXX")
          cp dsh/package.json dsh/package-lock.json "$test_tools/"
          npm ci --prefix "$test_tools" --no-audit --no-fund
          echo "CONEST_VITEST=$test_tools/node_modules/.bin/vitest" >> "$GITHUB_ENV"
      - name: Channel client regressions
        if: ${{ !cancelled() }}
        working-directory: .
        run: '"$CONEST_VITEST" run --config dsh/vitest.config.mjs'
      # A PR that edits dsh/packages/client-ui-discord without rebuilding the embedded bundle skipped bridge-go
      # (go=false) and only failed on develop (runs 41836087833, 41838005851, 41846409429). Run the bundle
      # checks here whenever bridge-go is skipped; when it runs, its core shards already cover them.
      - name: Embedded DSH bundle matches source
        if: ${{ !cancelled() && env.RUN_GO != 'true' }}
        run: go test -tags no_web -count=1 -run '^(TestDSHBundle|TestExtractEmbeddedDSH)' ./core
      # go mod verify, go build and go vet (linux and windows) run as the build-* shards of bridge-go, in
      # parallel with the tests: here they were ~180s in series (run 41867920458).

  bridge-go:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ./core is split in two by test name; every other package is split in two by package (run with
        # -p 1 these took ~280s in one shard, run 41867920458). build-* hold the build and vet checks.
        shard: [core-1, core-2, rest-1, rest-2, build-linux, build-windows]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: go test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$SHARD" in
            build-linux)
              go mod verify
              go build -tags no_web ./...
              # vet was in bridge-fork; kept now that both share this job
              go vet -tags no_web ./...
              exit 0 ;;
            build-windows)
              # Windows is a supported platform (install.ps1): the code and its tests must keep compiling there.
              GOOS=windows GOARCH=amd64 go build -tags no_web ./...
              GOOS=windows GOARCH=amd64 go vet -tags no_web ./...
              exit 0 ;;
          esac
          core=$(go list -tags no_web ./core)
          if [ "${SHARD%-*}" = rest ]; then
            # Every non-core package goes to exactly one of the two rest shards: agent/ and cmd/ (cmd/cc-connect
            # ~46s, agent/antigravity ~26s) to rest-1, the rest (platform/feishu ~29s, ...) to rest-2.
            # Alternating by line put all three slow packages in one shard (run 41869251235).
            mod=$(go list -m)
            all=$(go list -tags no_web ./... | grep -vxF "$core")
            if [ "$SHARD" = rest-1 ]; then
              pkgs=$(echo "$all" | grep -E "^$mod/(agent|cmd)/" || true)
            else
              pkgs=$(echo "$all" | grep -vE "^$mod/(agent|cmd)/" || true)
            fi
            test -n "$pkgs"
            # -p 1 also serialises compiling the test binaries (about half of the old single rest shard's
            # ~330s, run 41860995508). Compile them in parallel first without running anything; the serial
            # run then only links from the warm build cache. Execution stays -p 1.
            go test -tags no_web -count=1 -c -o /dev/null $pkgs > /dev/null
            go test -tags no_web -p 1 -count=1 $pkgs
            exit 0
          fi
          # Every top-level Test/Fuzz/Example in ./core goes to exactly one of the two core shards.
          n=${SHARD#core-}
          names=$(go test -tags no_web -list '.*' ./core | grep -E '^(Test|Fuzz|Example)' | awk -v n="$n" 'NR % 2 == n % 2')
          test -n "$names"
          echo "$(echo "$names" | wc -l) tests in this shard"
          go test -tags no_web -p 1 -count=1 -timeout 8m -run "^($(echo "$names" | paste -sd'|' -))\$" ./core
      - name: Voice relay streaming race checks
        # on build-linux, which finishes well before the test shards; it used to add ~40s to core-1
        if: matrix.shard == 'build-linux'
        run: go test -race -tags no_web ./core -run 'TestVoiceRelayStream|TestVoiceSentenceSplitter' -count=1

  bridge:
    needs: [changes, bridge-checks, bridge-go]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsh == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CHECKS: ${{ needs.bridge-checks.result }}
          GO: ${{ needs.bridge-go.result }}
        run: |
          echo "bridge-checks=$CHECKS bridge-go=$GO"
          [ "$CHECKS" = success ] && { [ "$GO" = success ] || [ "$GO" = skipped ]; }

  # Fork PRs get the same companion steps under their own required check name.
  companion-fork:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && (needs.changes.result != 'success' || needs.changes.outputs.companion == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # same steps and versions as the companion job above
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - run: node --version
      - run: node --test tests/test_voice_player.cjs

  bridge-fork:
    needs: [changes, bridge-checks, bridge-go]
    if: ${{ always() && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsh == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CHECKS: ${{ needs.bridge-checks.result }}
          GO: ${{ needs.bridge-go.result }}
        run: |
          echo "bridge-checks=$CHECKS bridge-go=$GO"
          [ "$CHECKS" = success ] && { [ "$GO" = success ] || [ "$GO" = skipped ]; }
