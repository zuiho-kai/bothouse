name: CoNest checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - run: node --version
      - run: node --test tests/test_voice_player.cjs

  # 素材打包工具是主机侧脚本，不需要 ESP-IDF，所以单独一个轻量 job。
  # ubuntu-latest 不自带 ffmpeg（实测端到端用例被跳过），必须显式装，
  # 否则这个 job 会「绿」着跳过真正跑打包的那几条。
  firmware-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firmware/esp32s3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: ffmpeg -version | head -1
      - run: python -m unittest discover -s tests -p 'test_pack_assets.py' -v

  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: go mod verify
      - run: go build -tags no_web ./...
      - run: go test -tags no_web -p 1 -count=1 ./...
