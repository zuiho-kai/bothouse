name: README repository status

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-status.yml'
      - '.github/readme-status/**'
  pull_request:
    paths:
      - '.github/workflows/readme-status.yml'
      - '.github/readme-status/**'

permissions:
  contents: read

concurrency:
  group: readme-status-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Collect and render a snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/readme-status/readme-status.mjs collect "$RUNNER_TEMP/readme-status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-status
          path: ${{ runner.temp }}/readme-status/
          retention-days: 3

  publish:
    needs: collect
    if: github.repository == 'zuiho-kai/bothouse' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: readme-status
          path: ${{ runner.temp }}/readme-status/
      - name: Update the readme-status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/readme-status/readme-status.mjs publish "$RUNNER_TEMP/readme-status"
