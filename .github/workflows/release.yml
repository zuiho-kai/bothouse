name: Release bothouse

# Native bothouse downloads. DMGs are built on macOS.
# The Mac Studio runner (label bothouse-mac) builds the dmg (lipo, hdiutil, package-dmg.sh need macOS).
# Everything else runs on GitHub-hosted ubuntu-latest (free for this public repo, so releases do not queue
# behind PR checks): it cross-compiles Linux x64/arm64 and the Windows exe (CGO_ENABLED=0, so no C toolchain) and publishes.
# Windows 真机验装暂时没有：家里 Windows 机离线（windows-local、sanxin-hk 都连不上）；用户 2026-10-23「那就没必要先搞验证，
# 就先编译吧」。上线后把 smoke-windows / verify-windows 加回来，跑在 self-hosted windows runner 上（见 git 历史里的这两个 job）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（重新编并上传这个 tag 的包）
        required: true

# Build runs with read-only rights; only the publish job (no checkout, no third-party code) can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preempt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      runs: ${{ steps.cancel.outputs.runs }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: cancel
        with:
          script: |
            const cancelled = [];
            try {
              // Limit preemption to PR checks; branch pushes and releases are untouched.
              for (const workflow_id of ['ci.yml', 'ui-preview.yml']) {
                for (const status of ['queued', 'in_progress']) {
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    ...context.repo, workflow_id, event: 'pull_request', status, per_page: 100
                  });
                  for (const run of runs) {
                    if (run.event !== 'pull_request' || cancelled.some(r => r.id === run.id)) continue;
                    try {
                      await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                      cancelled.push({ id: run.id, workflow_id, sha: run.head_sha,
                        branch: run.head_branch, created_at: run.created_at,
                        repository: run.head_repository?.id });
                    } catch (error) {
                      // A run can complete between listing it and requesting cancellation.
                      const current = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: run.id })).data;
                      if (current.status !== 'completed') throw error;
                    }
                  }
                }
              }
            } catch (error) {
              // Publishing must not be blocked if the Actions control plane is unavailable.
              core.warning(`Could not preempt every PR run: ${error.message}`);
            } finally {
              // Persist partial success even if a later API call fails.
              core.setOutput('runs', JSON.stringify(cancelled));
              core.info(`Preempted ${cancelled.length} PR runs`);
            }

  build:
    needs: preempt
    strategy:
      matrix:
        include:
          - name: linux
            labels: ubuntu-latest
          - name: macos
            labels: [self-hosted, bothouse-mac]
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Fixed release signing identity (#299): macOS keeps privacy (TCC) permissions across updates
      # only while the identifier and certificate stay the same. The hash is the public SHA-1 of the
      # self-signed "Bothouse Release Signing" certificate; its key lives only in a keychain on the
      # self-hosted Mac (~/.config/bothouse-signing/). Both are compiled in, so the in-app update
      # can tell a release binary from a self-built one (bridge/core/update_sign.go).
      SIGN_ID: ai.bothouse.desktop
      SIGN_HASH: 90C081464BA60F81CE7FF6E18767F40D5E650CD1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
          # the self-hosted Mac keeps GOMODCACHE/GOCACHE on disk; the hosted Linux runner uses the Actions cache
          cache: ${{ matrix.name == 'linux' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build web wizard
        working-directory: bridge/web
        # Locked dependencies only, and no install scripts (esbuild's postinstall is only a check;
        # its platform binary comes from the @esbuild/* optional package). pnpm 10: the
        # pnpm-workspace.yaml here has no packages field, which pnpm 9 rejects.
        run: |
          corepack enable
          corepack prepare pnpm@10.34.7 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Bundle the self-hosted platform (hub) source
        # the setup wizard's 「在本机启动」 starts it from the binary (bridge/internal/rhhub)
        working-directory: bridge
        run: make hubsrc
      - name: Build binaries
        working-directory: bridge
        run: |
          set -euo pipefail
          mkdir -p ../dist
          commit=$(git rev-parse --short HEAD)
          built=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          targets="linux/amd64 linux/arm64 windows/amd64"
          if [ "$RUNNER_OS" = macOS ]; then targets="darwin/arm64 darwin/amd64"; fi
          for target in $targets; do
            os=${target%/*}; arch=${target#*/}
            native="bothouse-${os}-${arch}"
            exe=bothouse; [ "$os" = windows ] && exe=bothouse.exe
            mkdir -p "build/${native}"
            binary="build/${native}/${exe}"
            cgo=0
            cc="${CC:-cc}"
            ldflags="-s -w -X main.version=${TAG} -X main.commit=${commit} -X main.buildTime=${built}"
            ldflags="$ldflags -X github.com/chenhg5/cc-connect/core.ReleaseSignerID=${SIGN_ID}"
            if [ "$os" = darwin ]; then
              ldflags="$ldflags -X github.com/chenhg5/cc-connect/core.ReleaseSignerHash=${SIGN_HASH}"
              cgo=1
              cpu=$arch; [ "$arch" != amd64 ] || cpu=x86_64
              cc="clang -arch $cpu"
            elif [ "$os" = windows ]; then
              ldflags="$ldflags -H=windowsgui"
            fi
            CGO_ENABLED=$cgo CC="$cc" GOOS=$os GOARCH=$arch go build -trimpath -tags goolm \
              -ldflags "$ldflags" \
              -o "$binary" ./cmd/cc-connect
            case "$os" in
              windows)
                cp "$binary" ../dist/bothouse-windows.exe
                ;;
              linux)
                label=$arch; [ "$arch" != amd64 ] || label=x64
                cp "$binary" "../dist/bothouse-linux-${label}"
                ;;
            esac
          done
          if [ "$RUNNER_OS" = macOS ]; then
            lipo -create build/bothouse-darwin-arm64/bothouse build/bothouse-darwin-amd64/bothouse \
              -output build/bothouse-universal
            # Sign the single binary (not the .app): the in-app update swaps only this file, so its
            # signature must stand on its own. Nothing may modify the file after this.
            signdir="$HOME/.config/bothouse-signing"
            keychain="$signdir/bothouse-signing.keychain-db"
            # password from stdin, never in argv; the keychain's key partition list already allows codesign
            # (security set-key-partition-list -S apple-tool:,apple:,codesign:), so signing does not prompt
            security unlock-keychain "$keychain" < "$signdir/keychain.pass" >/dev/null
            trap 'security lock-keychain "$keychain"' EXIT
            codesign --force --keychain "$keychain" --sign "$SIGN_HASH" --identifier "$SIGN_ID" build/bothouse-universal
            security lock-keychain "$keychain"
            codesign --verify "-R=identifier \"$SIGN_ID\" and certificate leaf = H\"$SIGN_HASH\"" build/bothouse-universal
            ../.github/release-check/package-dmg.sh build/bothouse-universal ../dist/bothouse-mac.dmg "$TAG"
          fi
          cd ../dist
          shasum -a 256 bothouse-* > SHA256SUMS
      - name: Smoke test (linux x64 native; linux arm64 and windows exe headers)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          dist/bothouse-linux-x64 --version
          dist/bothouse-linux-x64 setup --help | grep -q 'setup apply'
          file dist/bothouse-linux-arm64 | tee /dev/stderr | grep -q 'ELF 64-bit.*ARM aarch64'
          file dist/bothouse-windows.exe | tee /dev/stderr | grep -q 'PE32+ executable.*x86-64'
      - name: Smoke test (macOS app bundle)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mount=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" dist/bothouse-mac.dmg
          plutil -lint "$mount/Bothouse.app/Contents/Info.plist"
          lipo -info "$mount/Bothouse.app/Contents/MacOS/bothouse"
          lipo "$mount/Bothouse.app/Contents/MacOS/bothouse" -verify_arch arm64
          lipo "$mount/Bothouse.app/Contents/MacOS/bothouse" -verify_arch x86_64
          "$mount/Bothouse.app/Contents/MacOS/bothouse" --version
          # the same check the in-app guard runs (core/update_sign.go): the copied-out single file must carry a full,
          # valid release signature; inside the unsealed .app only the resource seal is skipped
          req="identifier \"$SIGN_ID\" and certificate leaf = H\"$SIGN_HASH\""
          single=$(mktemp -d)/bothouse
          cp "$mount/Bothouse.app/Contents/MacOS/bothouse" "$single"
          codesign --verify "-R=$req" "$single"
          codesign --verify --ignore-resources "-R=$req" "$mount/Bothouse.app/Contents/MacOS/bothouse"
          hdiutil detach "$mount"
      - name: zstd for the cache archive (macOS)
        # actions/cache falls back to gzip when zstd is missing, and a gzip entry has a different cache version, so the
        # Linux publish job cannot restore it (run 39932903479). The Mac Studio has no zstd/Homebrew: build it once into
        # the runner tool cache.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # the cache action runs `tar --use-compress-program zstdmt`, so both names are needed (run 39934008581)
          if command -v zstd >/dev/null && command -v zstdmt >/dev/null; then exit 0; fi
          v=1.5.7
          d="$RUNNER_TOOL_CACHE/zstd/$v"
          if [ ! -x "$d/zstd" ]; then
            src=$(mktemp -d)
            curl -fsSL "https://github.com/facebook/zstd/releases/download/v$v/zstd-$v.tar.gz" | tar xz -C "$src" --strip-components=1
            make -C "$src/programs" -j8 zstd >/dev/null
            mkdir -p "$d" && cp "$src/programs/zstd" "$d/zstd"
          fi
          ln -sf zstd "$d/zstdmt"
          echo "$d" >> "$GITHUB_PATH"
      - name: Cache release dist
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          enableCrossOsArchive: true
          path: dist
          key: release-dist-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # cache/save only warns when it fails; fail here instead of later in publish
      - name: Check the cache entry exists
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          enableCrossOsArchive: true
          path: dist
          key: release-dist-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore linux/windows binaries from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          enableCrossOsArchive: true
          path: dist
          key: release-dist-linux-${{ github.run_id }}-${{ github.run_attempt }}
          # `gh run rerun --failed` keeps the passing build's entry from an earlier attempt (run 39957444103
          # attempt 2), so fall back to the newest entry of this run; the trailing '-' stops run ids that
          # merely start with this one from matching
          restore-keys: release-dist-linux-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Restore macos binaries from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          enableCrossOsArchive: true
          path: dist
          key: release-dist-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: release-dist-macos-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: gh CLI (preinstalled on hosted runners; otherwise kept in the runner tool cache)
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then exit 0; fi
          v=2.103.0
          d="$RUNNER_TOOL_CACHE/gh/$v"
          if [ ! -x "$d/bin/gh" ]; then
            mkdir -p "$d"
            curl -fsSL "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_arm64.tar.gz" | tar xz -C "$d" --strip-components=1
          fi
          echo "$d/bin" >> "$GITHUB_PATH"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum bothouse-* > SHA256SUMS)
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          # Notes come from docs/release-notes/<tag>.md at the tag (read through the API: this job has no checkout).
          if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/docs/release-notes/$TAG.md?ref=$TAG" \
              > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::docs/release-notes/$TAG.md not found at $TAG; add it before tagging"
            exit 1
          fi
          if grep -q 'TODO' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::docs/release-notes/$TAG.md still has a TODO"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" dist/* "${pre[@]}" --title "bothouse $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  # DSH installs plugins from git: `dsh plugin --profile web add 'github:zuiho-kai/bothouse#dsh-plugin&path:dsh/plugin-pkg'`.
  # The built outputs (plugin-pkg/collab, plugin-pkg/client) are gitignored on main, so each release force-pushes
  # a one-commit `dsh-plugin` branch holding only the packed files. Runs in parallel with the binary builds.
  dsh-plugin:
    needs: preempt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11.19.0
      - name: Build plugin package
        working-directory: dsh/plugin-pkg
        run: npm run build
      # The npm package bothouse-dsh ships with every release, versioned as the tag (v0.1.40 -> 0.1.40).
      # A re-run for a tag that is already on npm skips the publish.
      # Auth is npm trusted publishing: npmjs.com trusts this repo's release.yml, so no token is stored.
      - name: Publish bothouse-dsh to npm
        working-directory: dsh/plugin-pkg
        # An npm auth failure must not stop the dsh-plugin branch update below (DSH installs from it).
        continue-on-error: true
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          npm version "$ver" --no-git-tag-version --allow-same-version
          if npm view "bothouse-dsh@$ver" version >/dev/null 2>&1; then
            echo "bothouse-dsh@$ver is already on npm; skipping"
          else
            tagflag=()
            case "$ver" in *-*) tagflag=(--tag next) ;; esac
            npm publish --access public --loglevel verbose "${tagflag[@]}"
          fi
      - name: Force-update dsh-plugin branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dsh-plugin"
          rm -rf "$out"; mkdir -p "$out/dsh/plugin-pkg"
          (cd dsh/plugin-pkg && npm pack --dry-run --json | node -e \
            'for (const f of JSON.parse(require("fs").readFileSync(0))[0].files) console.log(f.path)' > "$RUNNER_TEMP/files.txt")
          rsync -a --files-from="$RUNNER_TEMP/files.txt" dsh/plugin-pkg/ "$out/dsh/plugin-pkg/"
          cd "$out"
          git init -q -b dsh-plugin
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "dsh-plugin: bothouse-dsh built from $TAG ($(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dsh-plugin

  resume-pr-checks:
    needs: [preempt, build, publish, dsh-plugin]
    if: always() && needs.preempt.outputs.runs != '' && needs.preempt.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREEMPTED_RUNS: ${{ needs.preempt.outputs.runs }}
        with:
          script: |
            const failed = [];
            for (const run of JSON.parse(process.env.PREEMPTED_RUNS)) {
              try {
                let current;
                for (let attempt = 0; attempt < 20; attempt++) {
                  current = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: run.id })).data;
                  if (current.status === 'completed') break;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
                if (current.status !== 'completed') throw new Error('cancellation has not completed');
                if (current.conclusion !== 'cancelled') continue;
                const recent = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo, workflow_id: run.workflow_id, event: 'pull_request',
                  branch: run.branch, per_page: 100
                });
                // A subsequent push already supersedes the cancelled check.
                if (recent.some(r => r.id !== run.id && r.created_at > run.created_at &&
                    r.head_repository?.id === run.repository)) {
                  core.info(`Run ${run.id} was superseded; keeping the newer check`);
                  continue;
                }
                await github.rest.actions.reRunWorkflow({ ...context.repo, run_id: run.id });
                core.info(`Restarted PR run ${run.id}`);
              } catch (error) {
                core.error(`Could not restart run ${run.id}: ${error.message}`);
                failed.push(run.id);
              }
            }
            if (failed.length) core.setFailed(`PR checks requiring retry: ${failed.join(', ')}`);
