name: Release cc-connect

# 打 tag（v*）时编 cc-connect 预编译包（带网页安装向导）发到 GitHub Release：
# macOS / Linux 是 .tar.gz（装法见根目录 install.sh），Windows 是 .zip（根目录 install.ps1）。
# 发布后 verify-windows 在干净的 windows-latest 上按文档那一行命令装一遍，跑首次运行、向导、
# 重启、退出和 setup apply 假数据（不用任何真凭据）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（重新编并上传这个 tag 的包）
        required: true

# Build runs with read-only rights; only the publish job (no checkout, no third-party code) can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build web wizard
        working-directory: bridge/web
        # Locked dependencies only, and no install scripts (esbuild's postinstall is only a check;
        # its platform binary comes from the @esbuild/* optional package). pnpm 10: the
        # pnpm-workspace.yaml here has no packages field, which pnpm 9 rejects.
        run: |
          corepack enable
          corepack prepare pnpm@10.34.7 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Bundle the self-hosted platform (hub) source
        # the setup wizard's 「在本机启动」 starts it from the binary (bridge/internal/rhhub)
        working-directory: bridge
        run: make hubsrc
      - name: Build binaries
        working-directory: bridge
        run: |
          set -euo pipefail
          mkdir -p ../dist
          commit=$(git rev-parse --short HEAD)
          built=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          # 包名和 cmd/cc-connect/update.go 的 archiveAssetName 一致，`cc-connect update` 能直接用。
          # Windows: .zip with cc-connect.exe — the name `cc-connect update` (archiveAssetName) and install.ps1 expect.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="cc-connect-${TAG}-${os}-${arch}"
            exe=cc-connect; [ "$os" = windows ] && exe=cc-connect.exe
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -tags goolm \
              -ldflags "-s -w -X main.version=${TAG} -X main.commit=${commit} -X main.buildTime=${built}" \
              -o "build/${name}/${exe}" ./cmd/cc-connect
            if [ "$os" = windows ]; then
              (cd "build/${name}" && zip -q -X "../../../dist/${name}.zip" "${exe}")
            else
              tar -C "build/${name}" -czf "../dist/${name}.tar.gz" "${exe}"
            fi
          done
          cd ../dist && sha256sum *.tar.gz *.zip > checksums.txt && cat checksums.txt
      - name: Smoke test (linux/amd64)
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && tar -C /tmp/smoke -xzf "dist/cc-connect-${TAG}-linux-amd64.tar.gz"
          /tmp/smoke/cc-connect --version
          /tmp/smoke/cc-connect setup --help | grep -q 'setup apply'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          # 1 天：artifact 只在本次 run 的 job 之间传递，发布后不再需要；额度按账号算，
          # run 39784879535 (v0.1.1) 因 "Artifact storage quota has been hit" 上传失败。
          retention-days: 1

  # Same check as the linux/amd64 smoke test, on a real Windows machine, before anything is published.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Smoke test (windows/amd64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "cc-connect-$env:TAG-windows-amd64.zip"
          $want = ((Get-Content dist/checksums.txt | Where-Object { $_ -match " $([regex]::Escape($asset))$" }) -split ' ')[0]
          $got = (Get-FileHash -Algorithm SHA256 "dist/$asset").Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Expand-Archive "dist/$asset" -DestinationPath smoke
          ./smoke/cc-connect.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exit $LASTEXITCODE" }
          $help = ./smoke/cc-connect.exe setup --help | Out-String
          if ($help -notmatch 'setup apply') { throw "setup --help has no 'setup apply'" }

  publish:
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${pre[@]}" --title "$TAG" \
              --notes "安装：macOS / Linux 用仓库根目录 install.sh，Windows 用 install.ps1（arm64、amd64），见 docs/GETTING_STARTED.md。"
          fi

  # Acceptance on a clean Windows runner, through the published release: the documented one-line
  # install (private-repo form, gh + this job's read-only token), first run → wizard link → wizard
  # page over HTTP → "restart to apply" → clean exit, setup apply with fake data, and the
  # Task Scheduler service (start at logon). No real Discord token anywhere.
  verify-windows:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # install.ps1 installs from the repo this workflow runs in (zuiho-kai/bothouse itself, or a CI copy)
      CONEST_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install with the documented one-liner
        shell: powershell
        run: |
          # docs/GETTING_STARTED.md (private repo form); ?ref= pins the install.ps1 of this tag
          gh api "repos/$env:GITHUB_REPOSITORY/contents/install.ps1?ref=$env:TAG" -H "Accept: application/vnd.github.raw" | Out-String | iex
      - name: Installed on the user PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $HOME '.local\bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Host "user PATH: $userPath"
          if (($userPath -split ';') -notcontains $dir) { throw "$dir is not on the user PATH" }
          $v = & (Join-Path $dir 'cc-connect.exe') --version | Out-String
          Write-Host $v
          if ($v -notmatch [regex]::Escape($env:TAG)) { throw "installed version is not $env:TAG" }
          # later steps start in a fresh process like a new terminal window: give them the user PATH
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: First run, wizard page, restart, clean exit
        shell: powershell
        run: python .github/release-check/windows_firstrun.py
      - name: setup apply with fake data fails with a fix and a non-zero exit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Join-Path $env:RUNNER_TEMP 'fake-setup.json'
          '{"discord": {"guild_id": "123456789012345678"}, "roles": [{"token": "fake.token.for-ci"}]}' | Out-File -FilePath $req -Encoding ascii
          $out = cc-connect setup apply --json $req | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"
          $res = $out | ConvertFrom-Json
          $fix = @($res.warnings | Where-Object { $_.blocking -and $_.fix })
          if ($code -eq 0 -or $res.ok -or -not $res.error -or $fix.Count -eq 0) { throw "expected ok=false, an error, a blocking warning with a fix, and a non-zero exit" }
          Write-Host "PASS: error=$($res.error) | fix=$($fix[0].fix) | url=$($fix[0].url) | exit=$code"
          exit 0  # the step would otherwise end with cc-connect's (expected) exit code 1
      - name: Background service (Task Scheduler, starts at logon), restart under it, stop leaves nothing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cc-connect daemon install
          if ($LASTEXITCODE -ne 0) { throw "daemon install exit $LASTEXITCODE" }
          $task = Get-ScheduledTask -TaskName cc-connect
          Write-Host "task triggers: $(($task.Triggers | ForEach-Object { $_.CimClass.CimClassName }) -join ',')"
          if (-not ($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' })) { throw "no logon trigger" }
          $running = $false
          for ($i = 0; $i -lt 30; $i++) {
            $st = cc-connect daemon status | Out-String
            if ($st -match 'Running') { $running = $true; break }
            Start-Sleep -Seconds 1
          }
          Write-Host $st
          if (-not $running) { throw "service not running" }
          # the service has no bots yet, so it serves the wizard: same link file as a first run
          $link = (Get-Content (Join-Path $HOME '.cc-connect\setup-link.txt') -Raw).Trim()
          $token = ([regex]::Match($link, 'token=([0-9a-f]+)')).Groups[1].Value
          $wait = { for ($i = 0; $i -lt 60; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing $link).StatusCode -eq 200) { return $true } } catch { }; Start-Sleep -Milliseconds 500 }; return $false }
          if (-not (& $wait)) { throw "service wizard not answering" }
          $before = @(Get-Process cc-connect -ErrorAction SilentlyContinue).Count
          $r = Invoke-RestMethod -Method Post -Uri 'http://localhost:9820/api/v1/restart' -Headers @{ Authorization = "Bearer $token" }
          Write-Host "POST restart under the service: ok=$($r.ok)"
          Start-Sleep -Seconds 3
          if (-not (& $wait)) { throw "service wizard not back after restart" }
          $after = @(Get-Process cc-connect -ErrorAction SilentlyContinue)
          Write-Host "cc-connect processes under the service: before restart $before, after restart $($after.Count)"
          if ($after.Count -ne 1) { throw "expected exactly one cc-connect after a restart under the service" }
          # an agent the bot started runs `cc-connect daemon restart` (setup apply's next_steps):
          # the command runs inside the service's own process tree and must still bring it back
          $old = $after[0]
          $exe = (Get-Command cc-connect).Source
          $agentLog = Join-Path $env:RUNNER_TEMP 'agent-daemon-restart.log'
          $agentPid = & .github/release-check/spawn_under.ps1 -ParentId $old.Id -CommandLine "cmd.exe /c `"`"$exe`" daemon restart > `"$agentLog`" 2>&1`""
          $agentProc = Get-CimInstance Win32_Process -Filter "ProcessId = $agentPid"
          Write-Host "agent stand-in pid $agentPid, parent $($agentProc.ParentProcessId) (service cc-connect pid $($old.Id))"
          if ($agentProc.ParentProcessId -ne $old.Id) { throw "stand-in is not a child of the service's cc-connect" }
          $back = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $now = @(Get-Process cc-connect -ErrorAction SilentlyContinue)
            $st = (Get-ScheduledTask -TaskName cc-connect).State
            if ($st -eq 'Running' -and $now.Count -eq 1 -and $now[0].Id -ne $old.Id -and (& $wait)) { $back = $true; break }
          }
          if (Test-Path -LiteralPath $agentLog) { Write-Host "agent's daemon restart output: $((Get-Content -LiteralPath $agentLog -Raw))" }
          $now = @(Get-Process cc-connect -ErrorAction SilentlyContinue)
          Write-Host "after daemon restart from inside the service: task $((Get-ScheduledTask -TaskName cc-connect).State), cc-connect pids $($now.Id -join ',') (was $($old.Id))"
          if (-not $back) { throw "service did not come back after daemon restart from inside its own process tree" }
          # stop, install --force and uninstall from inside the service as well: each must finish
          # (the whole operation moves out of the tree), not leave the service half done
          $inTree = {
            param($sub, $check, $what)
            $svc = @(Get-Process cc-connect -ErrorAction SilentlyContinue)
            if ($svc.Count -ne 1) { throw "expected one service cc-connect before '$sub', got $($svc.Count)" }
            $log = Join-Path $env:RUNNER_TEMP ("agent-daemon-" + ($sub -replace '\W', '-') + ".log")
            $null = & .github/release-check/spawn_under.ps1 -ParentId $svc[0].Id -CommandLine "cmd.exe /c `"`"$exe`" daemon $sub > `"$log`" 2>&1`""
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) { Start-Sleep -Milliseconds 500; if (& $check $svc[0].Id) { $ok = $true; break } }
            if (Test-Path -LiteralPath $log) { Write-Host "agent's daemon $sub output: $((Get-Content -LiteralPath $log -Raw))" }
            $t = Get-ScheduledTask -TaskName cc-connect -ErrorAction SilentlyContinue
            Write-Host "after daemon $sub from inside the service: task $(if ($t) { $t.State } else { 'gone' }), cc-connect pids $(@(Get-Process cc-connect -ErrorAction SilentlyContinue).Id -join ',') (was $($svc[0].Id))"
            if (-not $ok) { throw "daemon $sub from inside the service: $what" }
          }
          & $inTree 'stop' { param($was) ((Get-ScheduledTask -TaskName cc-connect).State -ne 'Running') -and @(Get-Process cc-connect -ErrorAction SilentlyContinue).Count -eq 0 } 'expected the task stopped and no cc-connect'
          cc-connect daemon start
          for ($i = 0; $i -lt 30 -and -not ((Get-ScheduledTask -TaskName cc-connect).State -eq 'Running' -and @(Get-Process cc-connect -ErrorAction SilentlyContinue).Count -eq 1); $i++) { Start-Sleep -Milliseconds 500 }
          & $inTree 'install --force' { param($was) $t = Get-ScheduledTask -TaskName cc-connect -ErrorAction SilentlyContinue; $p = @(Get-Process cc-connect -ErrorAction SilentlyContinue); $t -and $t.State -eq 'Running' -and $p.Count -eq 1 -and $p[0].Id -ne $was } 'expected the task reinstalled and running with one new cc-connect'
          & $inTree 'uninstall' { param($was) $null -eq (Get-ScheduledTask -TaskName cc-connect -ErrorAction SilentlyContinue) -and @(Get-Process cc-connect -ErrorAction SilentlyContinue).Count -eq 0 -and -not (Test-Path (Join-Path $HOME '.cc-connect\cc-connect-daemon.ps1')) } 'expected the task, the script and every cc-connect gone'
          Write-Host "hand-off log:"; Get-Content (Join-Path $HOME '.cc-connect\logs\daemon-handoff.log')
          # back to a running service for the outside stop/uninstall check below
          cc-connect daemon install
          if ($LASTEXITCODE -ne 0) { throw "daemon install (again) exit $LASTEXITCODE" }
          for ($i = 0; $i -lt 30 -and (Get-ScheduledTask -TaskName cc-connect).State -ne 'Running'; $i++) { Start-Sleep -Milliseconds 500 }
          cc-connect daemon stop
          if ($LASTEXITCODE -ne 0) { throw "daemon stop exit $LASTEXITCODE" }
          cc-connect daemon uninstall
          if ($LASTEXITCODE -ne 0) { throw "daemon uninstall exit $LASTEXITCODE" }
          $left = $null
          for ($i = 0; $i -lt 20; $i++) { $left = @(Get-Process cc-connect -ErrorAction SilentlyContinue); if ($left.Count -eq 0) { break }; Start-Sleep -Milliseconds 500 }
          if ($left.Count -ne 0) { throw "cc-connect still running after daemon stop/uninstall: $($left.Id -join ',')" }
          Write-Host "PASS: daemon install / Running / restart keeps one process / stop+uninstall leaves no cc-connect"
      - name: Reinstall twice while cc-connect runs and restarts (backup .exe names must not collide)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $HOME '.local\bin'
          $p = Start-Process cc-connect -PassThru -WindowStyle Hidden
          $link = $null
          for ($i = 0; $i -lt 60 -and -not $link; $i++) { Start-Sleep -Milliseconds 500; try { $link = (Get-Content (Join-Path $HOME '.cc-connect\setup-link.txt') -Raw).Trim(); if ((Invoke-WebRequest -UseBasicParsing $link).StatusCode -ne 200) { $link = $null } } catch { $link = $null } }
          if (-not $link) { throw "wizard did not come up" }
          $token = ([regex]::Match($link, 'token=([0-9a-f]+)')).Groups[1].Value
          $restart = {
            Invoke-RestMethod -Method Post -Uri 'http://localhost:9820/api/v1/restart' -Headers @{ Authorization = "Bearer $token" } | Out-Null
            for ($i = 0; $i -lt 60; $i++) { Start-Sleep -Milliseconds 500; try { if ((Invoke-WebRequest -UseBasicParsing $link).StatusCode -eq 200) { return } } catch { } }
            throw "wizard not back after restart"
          }
          $install = { gh api "repos/$env:GITHUB_REPOSITORY/contents/install.ps1?ref=$env:TAG" -H "Accept: application/vnd.github.raw" | Out-String | iex }
          for ($round = 1; $round -le 2; $round++) {
            & $restart
            & $install
            $n = @(Get-Process cc-connect -ErrorAction SilentlyContinue).Count
            $backups = @(Get-ChildItem -LiteralPath $dir -Filter 'cc-connect.exe.old*' | ForEach-Object Name)
            Write-Host "round $($round): reinstall OK while running; cc-connect processes $n; backups: $($backups -join ', ')"
            if ($n -gt 2) { throw "restarts stacked up parent processes: $n" }
          }
          & $restart
          $n = @(Get-Process cc-connect -ErrorAction SilentlyContinue).Count
          Write-Host "after another restart: cc-connect processes $n"
          if ($n -gt 2) { throw "restarts stacked up parent processes: $n" }
          & (Join-Path $dir 'cc-connect.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed exe does not run" }
          Get-Process cc-connect -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "PASS: reinstalled twice over a running, restarted cc-connect; at most one parent + one child"
      - name: Quick-try command from setup apply, with spaces in the home and config paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $spaceHome = Join-Path $env:RUNNER_TEMP 'Jane Doe'
          $cfg = Join-Path $spaceHome 'my configs\config.toml'
          New-Item -ItemType Directory -Force -Path (Split-Path $cfg) | Out-Null
          # a stand-in agent CLI and a stand-in Discord API (no real token anywhere)
          $bin = Join-Path $env:RUNNER_TEMP 'fakecli'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          '@echo 1.0.0 (Claude Code)' | Out-File -FilePath (Join-Path $bin 'claude.cmd') -Encoding ascii
          $env:Path = "$bin;$env:Path"
          $fake = Start-Process python -ArgumentList '.github/release-check/fake_discord.py','18999' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $env:CONEST_DISCORD_API_BASE = 'http://127.0.0.1:18999'
          $req = Join-Path $env:RUNNER_TEMP 'ok-setup.json'
          '{"discord": {"guild_id": "900", "channel_id": "1"}, "roles": [{"token": "MTEx.ci.fake"}]}' | Out-File -FilePath $req -Encoding ascii
          # Go reads USERPROFILE; Windows PowerShell's $HOME is HOMEDRIVE + HOMEPATH
          $env:USERPROFILE = $spaceHome
          $env:HOMEDRIVE = Split-Path -Qualifier $spaceHome
          $env:HOMEPATH = Split-Path -NoQualifier $spaceHome
          $out = cc-connect setup apply --json $req --config $cfg | Out-String
          $res = $out | ConvertFrom-Json
          Write-Host "setup apply: saved=$($res.saved) warnings=$(($res.warnings | ForEach-Object code) -join ',')"
          if (-not $res.saved) { throw "setup apply did not save: $out" }
          $line = @($res.next_steps | Where-Object { $_ -like 'Just a quick try:*' })[0]
          Write-Host "next_steps: $line"
          $try = ([regex]::Match($line, '^Just a quick try: (.*) \(log in ')).Groups[1].Value
          if (-not $try) { throw "no quick-try command in next_steps" }
          # run it exactly as given, in a fresh PowerShell whose home has a space; then make sure it
          # did not leave CC_LOG_FILE set in that window
          # -EncodedCommand: Windows PowerShell drops the inner double quotes when it passes a
          # plain -Command string to powershell.exe, which would test a different command
          $text = $try + '; if ($env:CC_LOG_FILE) { Write-Host "CC_LOG_FILE left set"; exit 3 }'
          powershell -NoProfile -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($text)))
          if ($LASTEXITCODE -ne 0) { throw "quick-try command failed or left CC_LOG_FILE set (exit $LASTEXITCODE)" }
          $proc = $null
          for ($i = 0; $i -lt 20 -and -not $proc; $i++) { Start-Sleep -Milliseconds 500; $proc = Get-CimInstance Win32_Process -Filter "Name = 'cc-connect.exe'" | Select-Object -First 1 }
          if (-not $proc) { throw "cc-connect did not start" }
          Write-Host "running: $($proc.CommandLine)"
          if ($proc.CommandLine -notlike "*--config `"$cfg`"*") { throw "--config path was split: $($proc.CommandLine)" }
          $log = Join-Path $spaceHome '.cc-connect\run.log'
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $log); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $log)) { throw "no log at $log" }
          Write-Host "log file: $log ($((Get-Item -LiteralPath $log).Length) bytes)"
          Get-Content -LiteralPath $log -TotalCount 5
          Get-Process cc-connect -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $fake.Id -Force
          Write-Host "PASS: quick-try with spaces in home and config path: one --config argument, log in the spaced home, CC_LOG_FILE not left set"

  # 用户 2026-10-22「留1小时」：artifact 只用来在本次 run 的 job 之间传包，发布、验收完就删掉本次 run 的全部
  # artifact（retention-days 最小 1 天，只作兜底）。额度按账号算，run 39784879535 曾因额度满上传失败。
  cleanup-artifacts:
    needs: [build, smoke-windows, publish, verify-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for id in $(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "deleted artifact $id"
          done
