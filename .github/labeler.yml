          - 'bridge/agent/copilot/**'
          - 'bridge/agent/cursor/**'
          - 'bridge/agent/devin/**'
          - 'bridge/agent/dsh/**'
          - 'bridge/agent/gemini/**'
          - 'bridge/agent/iflow/**'
          - 'bridge/agent/kimi/**'
          - 'bridge/agent/opencode/**'
          - 'bridge/agent/pi/**'
          - 'bridge/agent/qoder/**'
