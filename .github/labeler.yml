area/core:
  - changed-files:
      - any-glob-to-any-file:
          - 'bridge/core/**'
          - 'bridge/daemon/**'
          - 'bridge/config/**'
          - 'bridge/config.example.toml'
          - 'bridge/cmd/**'
          - 'bridge/internal/**'
          - 'bridge/*.go'
          - 'bridge/go.mod'
