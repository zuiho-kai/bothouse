# Area labels mapping for pull requests based on changed files
# Reference: notes/gh-labels-1024.md

area/discord:
  - changed-files:
      - any-glob-to-any-file: 'bridge/platform/discord/**'

area/telegram:
  - changed-files:
      - any-glob-to-any-file: 'bridge/platform/telegram/**'

area/feishu:
  - changed-files:
      - any-glob-to-any-file: 'bridge/platform/feishu/**'

area/slack:
  - changed-files:
      - any-glob-to-any-file: 'bridge/platform/slack/**'

area/cn-im:
  - changed-files:
      - any-glob-to-any-file:
          - 'bridge/platform/dingtalk/**'
          - 'bridge/platform/wecom/**'
          - 'bridge/platform/weixin/**'
          - 'bridge/platform/qq/**'
          - 'bridge/platform/qqbot/**'
          - 'bridge/platform/weibo/**'
          - 'bridge/platform/wps-agentspace/**'
          - 'bridge/platform/wps-xiezuo/**'
          - 'bridge/platform/yuanbao/**'

area/other-platform:
