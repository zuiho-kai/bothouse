area/web:
  - changed-files:
      - any-glob-to-any-file: 'bridge/web/**'

area/install-ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'install.sh'
          - 'install.ps1'
          - 'bridge/npm/**'
          - 'bridge/Makefile'
          - 'bridge/.github/**'
