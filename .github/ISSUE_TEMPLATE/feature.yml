name: 功能建议
description: 新能力、新平台或新后端支持
title: "[feature] "
labels: ["kind/feature", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue。一个 issue 只写一件事。
  - type: textarea
    id: goal
    attributes:
      label: 用户目标
      description: 谁在什么情况下需要什么结果？现有能力为什么不够？
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 具体场景
      description: 一个输入、期望的输出和检查方式。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - Discord
        - Telegram
        - 飞书 / Lark
        - Slack
        - 国内其他 IM
        - 其他平台
        - Claude Code 后端
        - Codex 后端
        - 其他 CLI 后端
        - 核心 / 配置
        - 网页管理界面
        - 安装 / 发布
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代做法
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 本次做什么、不做什么、依赖项。
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现
