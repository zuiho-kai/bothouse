# 角色小家配置。改完重启服务生效。

[meeting]
# 每个话题最多几轮角色发言，到了就停。
# 来源：橘定，防止无限讨论耗额度。
max_turns_per_topic = 6
# “在说”时长按文字长度估算：秒 = 字数 / chars_per_sec。
# 来源：橘定的估算值（中文朗读约每秒 5 字）。开语音时有 voice 的角色按真实播放时长交棒，
# 这个估算只用于没有 voice 的角色、--no-voice 和被打断时估“说出了几个字”。
chars_per_sec = 5.0

[brain]
# 每个角色的大脑是一份 Claude Code 会话（claude -p）。开发测试用 haiku 省额度。
model = "haiku"
# 单次生成超时（秒）。来源：橘定，防止 claude 进程卡死占住话题。
timeout_sec = 120

[voice]
# 角色发言的合成方式："qwen" = 本机 Qwen3-TTS（不联网），"say" = macOS say（切回旧声音改这一行，重启主机）。
# 来源：用户 2026-10-18「现在语音太笨了太电子了，搞点比较偏人音的」「声音太人机了」；橘定换 Qwen3-TTS。
# Qwen 某句合成出错会自动改用该角色的 say 音色（voice）。
backend = "qwen"
# 装了 mlx-audio 的 Python 和模型目录。来源：橘 18:00 试听用的模型 mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit
# （ModelScope 下载，试听时在 /tmp/q3dl/m8，复制到下面这个目录）；Python 同 ~/ai-voice/README.md。
qwen_python = "~/ai-voice/tts-venv/bin/python"
qwen_model = "~/ai-voice/models/qwen3-tts-0.6b-cv-8bit"
# 没有设备在线时，本机喇叭和收音怎么走（改完重启主机）：
#   "vpio"   = 都走 macOS 系统语音处理（FaceTime 那套回声消除，rh/vpio.py）：角色说话时用户喊「暂停」、叫名字也听得见；
#   "afplay" = 旧方式：afplay 播、直接读麦，没有回声消除（真机效果不好时改回它）。
# 来源：用户 2026-10-19「来个唤醒词」「有个安全词去暂停声音」，角色说话时喇叭回声比人声响、这两样听不见（/tmp/rhwake/accept.log）。
player = "vpio"

[wake]
# 语音口令（rh/wake.py）。语音要叫到角色名（或下面的产品名）才算对她们说，否则不进频道、不打断。
# 来源：用户 2026-10-19「你可能指定跟他们说他们才会应你，否则就当不存在」「或者我们产品名，xxx」。
# 叫某个角色名：只有她回；叫产品名：大家按轮流回。网页打字不用叫名字。
# 产品名：用户还没定名，橘暂用「小家」（「角色小家」），用户定了改这里。
product = ["小家"]
# 安全词：不用叫名字，说了立刻停掉正在说的、结束这个话题。来源：用户「有个呃安全词啊去暂停声音」；词是橘定的暂用词。
pause = "暂停"
# 闭麦：立刻停掉正在说的、不再收音；闭麦期间只认「开麦」。来源：用户「我希望可以语音闭麦」。
mute = "闭麦"
unmute = "开麦"
# 本地唤醒模型（rh/kws.py，sherpa-onnx 关键词检测）：和转文字并联一直听，上面这些词和各角色的唤醒词任一边认出即生效。
# 来源：用户 2026-10-19「我说了个鲸鱼娘在吗？他没有反应」「你看别人小爱音箱怎么玩的…小艺小度」，橘提出本地唤醒模型后「那你继续」。
# 模型不进 git，下载命令见 README「本地唤醒模型」；放在这里（和 Qwen3-TTS 模型同目录）。删掉这一行 = 只靠转文字。
kws_model = "~/ai-voice/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
# 角色的别的叫法写在各角色的 aliases（可空）。同音字（橘→菊/局、鲸鱼娘→金鱼娘）不用写，按拼音比已经算上。
# 角色的 wake（可空）：语音只认这几个词叫她，name 和 aliases 不再算语音唤醒；网页打字照旧按 name、aliases。不填 = name+aliases。

[[roles]]
id = "ju"
name = "橘"
# 语音唤醒词：「小橘」，单字「橘」语音不算（几乎叫不醒，合成音过 ASR 0/30，/tmp/asrctx/report.md；还被「结局」误叫醒）。
# 来源：用户 2026-10-19「橘作为首字在音韵不好发言」「小橘怎么样」「就这样吧，小橘和小家，预期后面用户也能自定义，无所谓」。
wake = ["小橘"]
persona = "你是橘，橘色长发、抱着书的书斋主人，这个小家的大姐头。说话干脆，冷幽默，爱下结论，偶尔吐槽别人。"
avatar = "avatars/ju.png"   # 头像图片路径（相对本文件），可空。来源：用户问喜欢哪个，橘选 juzi-head-v2/cand1；四人按表盘同一模板裁（avatars/dial/ju.jpg）再缩到 240×240
voice = "Tingting"   # macOS say 音色（婷婷）。来源：用户指派任务时定的分配。Qwen 出错时退回它。
# Qwen 音色和语气。来源：橘按 18:00 试听定（~/ai-voice/out/rh-voice-cmp/qwen3-8bit_OnoAnna_干脆大姐头.wav），
# instruct 是生成该试听文件时的原句。
qwen_speaker = "Ono_Anna"
qwen_instruct = "用干脆利落、带点冷幽默的少女语气说"

[[roles]]
id = "jing"
name = "鲸鱼娘"
persona = "你是鲸鱼娘，一条蓝色大肥鱼变的少女，懒洋洋、傲娇、嘴甜，喜欢接梗，对麻烦事总想偷懒。"
avatar = "avatars/jing.png"   # 来源：用户给的鲸鱼娘大头像（用户 2026-10-18「我们之前不是给你那个头像了吗？你按照那个风格去搞」），去棋盘格底、同一模板裁后缩到 240×240
voice = "Meijia"     # 美佳。来源同上；留空 = 不出声，按字数估时长。
# 来源：橘按 18:00 试听定（qwen3-8bit_Serena_慵懒傲娇.wav），instruct 是生成时的原句。
qwen_speaker = "Serena"
qwen_instruct = "用慵懒的语气说，带一点傲娇"

[[roles]]
id = "mao"
name = "彩虹猫"
persona = "你是彩虹猫，一只拖着彩虹尾巴的猫，梗百科，什么动漫游戏冷知识都知道一点，说话跳脱、兴奋。"
avatar = "avatars/mao.png"    # 来源：按用户给的头像风格新画（~/im-bridge/avatars/caihongmao-head-v2/raw/cand3.png），同一模板裁后缩到 240×240
voice = "Sinji"      # 善怡。来源同上。
# 来源：橘按 18:00 试听定（qwen3-8bit_Vivian_活泼少女.wav），instruct 是生成时的原句。
qwen_speaker = "Vivian"
qwen_instruct = "用活泼可爱的少女语气说，语速轻快"

# 小智板子（ESP32 圆屏，rh/xiaozhi.py）：主机在这个端口提供 OTA 接口（/xiaozhi/ota/）和 WebSocket（/xiaozhi/v1/）。
# 来源：固件默认 OTA 地址 http://zuihomac-studio.local:8791/xiaozhi/ota/（~/code/role-household-fw 固件侧定的，两边同一个端口）。
# 删掉 [xiaozhi] 这一段 = 不起这个服务。改完重启主机生效。
[xiaozhi]
port = 8791

# 板子和角色的对应：device = 板子的 Device-Id（就是 MAC，主机日志「未绑定的板子 xx:xx:… 连上了」里能看到），role = 上面角色的 id。
# 一块板子一个角色；没写在这里的板子连上后不播任何东西，只记日志。用户以后自定义躯体就改这里。
# 2026-10-19 第一块板（90:70:69:f5:89:e4）先绑给橘做真板联调（橘定，用户「你先魔改他吧」）。
[[xiaozhi.boards]]
device = "90:70:69:f5:89:e4"
role = "ju"

# 形态 B：板子当现有平台（我们的 Discord）里 bot 的躯体（rh/discord_body.py）。
# 来源：用户 2026-10-19「一种就是进入现有的平台，别人现有的一个team下面，例如我们的discord」。
# gate（~/im-bridge/gate/rhbody.py）只把「bot 回应板子主人」的话转过来（主人 @ 她、开头点名她、或回复她的消息之后，她的下一条回复）；
# bot 之间互相说话不念（用户「你可能指定跟他们说他们才会应你，否则就当不存在」）。
# 删掉 [[discord.bots]] = 不收 Discord 的话。改完重启主机生效。
[discord]
# 真板播放开关，默认关：关着只记日志、不出声。来源：用户不在、睡觉时不许出声；开关等用户在场点头再开（橘 2026-10-19 定）。
play = false

# Discord bot ID → 角色：用这个角色的音色（qwen_speaker）、在绑给这个角色的板子（[[xiaozhi.boards]]）上念。
# bot ID 来源：~/wiki/bots/chat-bots/discord/discord-roles.md 第 28 行。别人的 team 里的 bot 同样加一条（用户「预期后面用户也能自定义」）。
# 龙娘没有对应的小家角色（没有音色和板子），先不映射；她的话只记一行「没映射，不念」。
[[discord.bots]]
bot_id = "1468663018463301632"
name = "Claude橘"
role = "ju"

[[discord.bots]]
bot_id = "1558553439942737962"
name = "鲸鱼娘"
role = "jing"

