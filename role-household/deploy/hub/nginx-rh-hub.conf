# vps-arm 上 /etc/nginx/sites-available/rh-hub.step2 的仓库版（sites-enabled/rh-hub 指向它）。
# 443：Let's Encrypt 给 IP 签的证书（2026-10-20），反代到容器 127.0.0.1:8791（同 Dockerfile）。
# 8790：旧 http 地址。网页（/、/dial）先给 /to-https 这页，把旧地址浏览器里存的 token 带到 https（rh/static/to-https.html）；
#       其他路径（接口、/ws、脚本）照旧 301 跳 https；用 $uri 不带查询串，?token= 不进 Location 和访问日志。
# 公网 IP 不写进仓库（同 deploy.sh「审查第 9 条」）：文件里是占位符 HUB_IP，部署时替换。
# 部署顺序：先 sh deploy/hub/deploy.sh 上带 /to-https 的容器，再换 nginx（反过来旧地址会先 404）：
#   HUB_IP=$(ssh -G vps-arm | awk '/^hostname /{print $2}')
#   sed "s/HUB_IP/$HUB_IP/g" deploy/hub/nginx-rh-hub.conf | ssh vps-arm "sudo tee /etc/nginx/sites-available/rh-hub.step2 >/dev/null && sudo nginx -t && sudo systemctl reload nginx"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name HUB_IP;
    ssl_certificate     /etc/letsencrypt/live/rh-hub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rh-hub/privkey.pem;
    client_max_body_size 0;
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }
}
server {
    listen 8790;
    listen [::]:8790;
    location = /     { proxy_pass http://127.0.0.1:8791/to-https; }
    location = /dial { proxy_pass http://127.0.0.1:8791/to-https; }
    location / { return 301 https://HUB_IP$uri; }
}
