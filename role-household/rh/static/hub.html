<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色小家</title>
<style>
  /* 配色照 Discord 深色主题。 */
  :root { --server:#1e1f22; --side:#2b2d31; --chat:#313338; --panel:#232428; --hover:#2e3035; --sel:#404249;
          --text:#dbdee1; --head:#f2f3f5; --muted:#949ba4; --faint:#80848e; --blurple:#5865f2; --green:#23a55a;
          --red:#f23f43; --input:#383a40; --accent:#f0a020; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--chat); color:var(--text); font:15px/1.375 "gg sans","Noto Sans",-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
         display:flex; height:100vh; overflow:hidden; }
  button { font:inherit; }
  /* ---- 服务器栏 ---- */
  #servers { width:72px; flex:none; background:var(--server); display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 0; }
  .srv { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--head);
         background:var(--chat); font-weight:600; font-size:18px; text-decoration:none; position:relative; transition:border-radius .15s, background .15s; }
  .srv:hover, .srv.on { border-radius:16px; }
  .srv.on { background:var(--accent); color:#1e1f22; }
  .srv.on::before { content:""; position:absolute; left:-16px; width:8px; height:40px; border-radius:0 4px 4px 0; background:var(--head); }
  .srv:not(.on):hover { background:var(--green); color:#fff; }
  .sep { width:32px; height:2px; background:#35363c; border-radius:1px; }
  /* ---- 频道列表 ---- */
  #channels { width:240px; flex:none; background:var(--side); display:flex; flex-direction:column; }
  #channels .top { height:48px; padding:0 16px; display:flex; align-items:center; font-weight:600; color:var(--head);
                   box-shadow:0 1px 0 rgba(4,4,5,.2),0 1.5px 0 rgba(6,6,7,.05),0 2px 0 rgba(4,4,5,.05); }
  #chlist { flex:1; padding:16px 8px; overflow-y:auto; }
  .cat { font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.02em; padding:0 8px 4px; text-transform:uppercase; }
  .ch { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:4px; color:var(--muted); text-decoration:none; margin-bottom:2px; }
  .ch .hash { font-size:20px; line-height:1; color:var(--faint); width:20px; text-align:center; }
  .ch.on { background:var(--sel); color:var(--head); }
  .ch:not(.on):hover { background:var(--hover); color:var(--text); }
  #me { height:52px; background:var(--panel); padding:0 8px; display:flex; align-items:center; gap:8px; }
  #me .info { flex:1; min-width:0; line-height:1.2; }
  #me .nm { color:var(--head); font-weight:600; font-size:14px; }
  #meta { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  #sound { border:none; border-radius:4px; padding:5px 8px; background:var(--blurple); color:#fff; font-size:12px; cursor:pointer; white-space:nowrap; }
  #sound:disabled { background:transparent; color:var(--green); cursor:default; padding:5px 2px; }
  #mic { border:none; border-radius:4px; padding:5px 8px; background:#4e5058; color:#fff; font-size:12px; cursor:pointer; white-space:nowrap; }
  #mic.off { background:var(--red); }
  /* ---- 头像 ---- */
  .av { width:40px; height:40px; border-radius:50%; flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center;
        color:#fff; font-weight:600; font-size:16px; position:relative; }
  .av img { width:100%; height:100%; object-fit:cover; display:block; }
  .av.sm { width:32px; height:32px; font-size:14px; }
  /* ---- 中间消息区 ---- */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--chat); }
  #main .top { height:48px; flex:none; padding:0 16px; display:flex; align-items:center; gap:8px;
               box-shadow:0 1px 0 rgba(4,4,5,.2),0 1.5px 0 rgba(6,6,7,.05),0 2px 0 rgba(4,4,5,.05); }
  #main .top .hash { font-size:24px; color:var(--faint); }
  #room { font-weight:600; color:var(--head); }
  #main .top .topic { color:var(--muted); font-size:14px; border-left:1px solid #3f4147; padding-left:12px; margin-left:4px;
                      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #log { flex:1; overflow-y:auto; padding:16px 0 8px; display:flex; flex-direction:column; }
  #log::before { content:""; flex:1 0 0; }   /* 消息少时贴底，同 Discord */
  .msg { flex:none; }
  .msg { display:flex; gap:16px; padding:2px 48px 2px 16px; margin-top:17px; position:relative; }
  .msg:hover { background:#2e3035; }
  .msg.cont { margin-top:0; }
  .msg.cont .av, .msg.cont .hdr { display:none; }
  .msg .gut { width:40px; flex:none; }
  .msg:not(.cont) .gut { display:none; }
  .msg.cont .gut { font-size:11px; color:var(--faint); text-align:center; padding-top:3px; visibility:hidden; }
  .msg.cont:hover .gut { visibility:visible; }
  .msg .body { min-width:0; flex:1; }
  .hdr { display:flex; align-items:baseline; gap:8px; }
  .who { font-weight:500; color:var(--head); }
  .t { font-size:12px; color:var(--faint); }
  .text { white-space:pre-wrap; word-wrap:break-word; color:var(--text); }
  .msg.speaking { background:rgba(240,160,32,.08); }
  .msg.speaking::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent); }
  .msg.speaking .hdr::after, .msg.speaking.cont .text::after { content:"正在说"; font-size:10px; font-weight:600; color:#1e1f22; background:var(--accent);
         border-radius:3px; padding:0 4px; align-self:center; }
  .msg.speaking.cont .text::after { margin-left:6px; }
  .msg.interrupted .text::after { content:"（被打断）"; color:var(--red); }
  .msg.system { margin-top:8px; color:var(--muted); align-items:center; }
  .msg.system .av { width:40px; height:16px; color:var(--green); font-size:16px; background:none !important; }
  .msg.system .who { display:none; }
  .msg.system .text { color:var(--muted); font-size:14px; }
  .msg.system .hdr { display:none; }
  .msg.system .t2 { font-size:12px; color:var(--faint); margin-left:8px; }
  #err { color:var(--red); padding:0 16px; font-size:13px; }
  #err:not(:empty) { padding-top:4px; }
  form#f { padding:0 16px 24px; flex:none; }
  form#f .box { display:flex; align-items:center; background:var(--input); border-radius:8px; padding:0 8px 0 16px; }
  #in { flex:1; padding:11px 0; border:none; outline:none; background:transparent; color:var(--text); font:inherit; }
  #in::placeholder { color:var(--faint); }
  form#f button { border:none; background:transparent; color:var(--muted); padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:600; }
  form#f button:hover { color:var(--head); background:#4e5058; }
  /* ---- 右侧成员 ---- */
  #members { width:240px; flex:none; background:var(--side); overflow-y:auto; padding:16px 8px; }
  #members .cat { padding:16px 8px 4px; }
  #members .cat:first-child { padding-top:0; }
  .member { display:flex; align-items:center; gap:12px; padding:5px 8px; border-radius:4px; margin-bottom:2px; }
  .member:hover { background:var(--hover); }
  .member .nm { font-weight:500; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .member .state { font-size:12px; color:var(--muted); line-height:1.3; }
  .member .wrap { position:relative; flex:none; }
  .member .dot { position:absolute; right:-2px; bottom:-2px; width:14px; height:14px; border-radius:50%; background:var(--green); border:3px solid var(--side); }
  .member.idle .dot { background:#f0b232; }
  .member.idle { opacity:.62; }
  .member.idle:hover { opacity:1; }
  .member .vol { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--faint); margin-top:2px; }
  .member .vol input { width:96px; accent-color:var(--accent); }
  .member .vol input:disabled { opacity:.4; }
  .head.speaking { background:var(--sel); }
  .head.speaking .av { box-shadow:0 0 0 2px var(--side), 0 0 0 4px var(--green); }
  .head.speaking .state { color:var(--green); }
  .head.thinking .state { color:var(--head); }
  .head.interrupted .state { color:var(--red); }
  /* ---- 登录 ---- */
  #login { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); align-items:center; justify-content:center; z-index:9; }
  #login .card { background:var(--chat); border-radius:8px; padding:28px 32px; width:420px; max-width:92vw; text-align:center; }
  #login h2 { margin:0 0 6px; color:var(--head); font-size:22px; }
  #login p { margin:0 0 18px; color:var(--muted); font-size:14px; }
  #login .tip { color:var(--red); }
  #tok { width:100%; padding:10px; border:none; border-radius:4px; background:var(--server); color:var(--text); font:inherit; outline:none; margin-bottom:16px; }
  #login button { width:100%; border:none; border-radius:4px; padding:10px; background:var(--blurple); color:#fff; font-weight:600; cursor:pointer; }
  body.need-token #login { display:flex; }
  @media (max-width: 900px) { #channels, #members { display:none; } }
</style>
</head>
<body>
<nav id="servers">
  <a class="srv on" href="/" title="角色小家">家</a>
  <div class="sep"></div>
  <a class="srv" href="/dial" title="圆屏表盘">◎</a>
</nav>
<aside id="channels">
  <div class="top">角色小家</div>
  <div id="chlist">
    <div class="cat">文字频道</div>
    <a class="ch on" href="/"><span class="hash">#</span><span id="chname">频道</span></a>
  </div>
  <div id="me">
    <div class="av sm" style="background:var(--blurple)">你</div>
    <div class="info"><div class="nm">你</div><span id="meta">连接中…</span></div>
    <button id="mic" title="闭麦：立刻停掉正在说的，不再收音；再点开麦。也可以说「闭麦」「开麦」">闭麦</button>
    <button id="sound" title="浏览器要点一下才允许出声；开了以后角色的声音在这个网页里播">开声音</button>
  </div>
</aside>
<div id="main">
  <div class="top"><span class="hash">#</span><span id="room">频道</span><span class="topic">发一个话题，角色们轮流接话；随时插话就能打断</span></div>
  <div id="log"></div>
  <div id="err"></div>
  <form id="f"><div class="box"><input id="in" placeholder="发一个话题，或随时插话打断" autocomplete="off"><button>发送</button></div></form>
</div>
<aside id="members"></aside>
<form id="login"><div class="card"><h2>欢迎回来</h2><p id="loginwhy">输入访问 token 进入频道</p>
  <input id="tok" type="password" placeholder="输入访问 token" autocomplete="off"><button>进入</button></div></form>
<script>
window.rhHooks = {
  render: () => { renderMembers(); renderLog(); },
  status: (text) => { $("meta").textContent = text; if (text === "已连接") document.body.classList.remove("need-token"); },
  needToken: (why) => { document.body.classList.add("need-token"); $("meta").textContent = why;
                        $("loginwhy").textContent = why; $("loginwhy").classList.toggle("tip", why !== "需要 token"); },
  deviceRoles: () => members.filter(x => x.kind === "role").map(x => x.id),
  onMic: (on) => { const b = $("mic"); b.classList.toggle("off", !on); b.textContent = on ? "闭麦" : "已闭麦，点此开麦"; },
};
</script>
<script src="/queue-player.js"></script>
<script src="/rh-client.js"></script>
<script>
// 网页是云端的投影：WebSocket 收推送、HTTP 发消息（连接和设备代码在 rh-client.js）。token 存在本机浏览器 localStorage，
// 也可以用 地址#token=... 打开一次（# 后面的部分不会发给服务器）。
const COLORS = ["#f0a020", "#4aa8ff", "#c67bff", "#3ecf8e", "#ff6b8a"];
// 同一个人连续发言、间隔不超过这么多秒就合并成一组（不再重复头像和名字）。来源：实现者定，照 Discord 的观感。
const GROUP_SEC = 7 * 60;
const STATE_TEXT = {speaking: "正在说", thinking: "思考中…", interrupted: "被打断", idle: "待机"};
const hhmm = (t) => new Date(t*1000).toLocaleTimeString("zh-CN", {hour12:false, hour:"2-digit", minute:"2-digit"});
const fmt = (t) => {
  const d = new Date(t*1000), today = new Date();
  return (d.toDateString() === today.toDateString() ? "今天 " : d.toLocaleDateString("zh-CN") + " ") + hhmm(t);
};
const colorOf = () => Object.fromEntries(members.map((r, i) => [r.id, COLORS[i%COLORS.length]]));
const okAvatar = (a) => a && a.startsWith("data:image/");

function avatarHTML(id, name, color, small) {
  const m = members.find(x => x.id === id);
  if (m && okAvatar(m.avatar)) return `<div class="av${small ? " sm" : ""}"><img class="face" alt="" src="${esc(m.avatar)}"></div>`;
  if (id === "user") return `<div class="av${small ? " sm" : ""}" style="background:var(--blurple)">你</div>`;
  return `<div class="av${small ? " sm" : ""}" style="background:${color || "#5c5e66"}">${esc((name || "?")[0])}</div>`;
}

let volDragging = false;   // 正在拖音量滑条时不重画成员栏（重画会把拖着的滑条换掉）
function renderMembers() {
  if (volDragging) return;
  const states = roleStates(), color = colorOf();
  const roles = members.filter(x => x.kind === "role");
  const row = (r) => {
    const st = states[r.id].state, v = volumes[r.id], has = typeof v === "number";
    // 音量滑条：调的是这个角色的小智板子（用户 2026-10-19「我在这个网页端可以调大」）；没板子在线就灰掉
    const vol = `<div class="vol" title="${has ? "她的小智板子音量；也可以说「大声点」「小声点」" : "她没有小智板子在线"}">
      音量<input type="range" min="0" max="100" step="1" value="${has ? v : 0}" data-role="${esc(r.id)}"${has ? "" : " disabled"}>
      <span>${has ? v : "—"}</span></div>`;
    return `<div class="member head ${st}" id="head-${esc(r.id)}">
      <div class="wrap">${avatarHTML(r.id, r.name, color[r.id], true)}<span class="dot"></span></div>
      <div style="min-width:0"><div class="nm" style="color:${color[r.id]}">${esc(r.name)}</div>
      <div class="state">${STATE_TEXT[st]}</div>${vol}</div></div>`;
  };
  const talking = roles.filter(r => states[r.id].state === "speaking");
  const rest = roles.filter(r => states[r.id].state !== "speaking");
  $("members").innerHTML =
    (talking.length ? `<div class="cat">正在说 — ${talking.length}</div>` + talking.map(row).join("") : "") +
    `<div class="cat">在线 — ${rest.length + 1}</div>` +
    `<div class="member"><div class="wrap">${avatarHTML("user", "你", "", true)}<span class="dot"></span></div>
      <div><div class="nm" style="color:var(--head)">你</div><div class="state">在线</div></div></div>` +
    rest.map(row).join("");
}

function renderLog() {
  $("room").textContent = roomName || "频道"; $("chname").textContent = roomName || "频道";
  const list = [...msgs.values()].sort((a, b) => a.id - b.id);
  const color = colorOf();
  const atBottom = $("log").scrollTop + $("log").clientHeight >= $("log").scrollHeight - 30;
  let prev = null;
  $("log").innerHTML = list.map(x => {
    const text = esc(x.status === "interrupted" && x.spoken != null ? x.text.slice(0, x.spoken) + "……" : x.text);
    if (x.author_kind === "system") {
      prev = x;
      return `<div class="msg system"><div class="av">→</div><div class="body"><span class="who">${esc(x.name)}</span><span class="text">${text}</span><span class="t2">${fmt(x.created_at)}</span></div></div>`;
    }
    const cont = prev && prev.author_kind !== "system" && prev.author === x.author && x.created_at - prev.created_at <= GROUP_SEC;
    prev = x;
    return `<div class="msg ${x.status}${cont ? " cont" : ""}">${avatarHTML(x.author, x.name, color[x.author])}<div class="gut">${hhmm(x.created_at)}</div>
      <div class="body"><div class="hdr"><span class="who" style="color:${color[x.author] || "var(--head)"}">${esc(x.name)}</span><span class="t">${fmt(x.created_at)}</span></div>
      <div class="text">${text}</div></div></div>`;
  }).join("");
  if (atBottom) $("log").scrollTop = $("log").scrollHeight;
}
// “思考中”按时间过期，隔几秒重画一次成员栏。来源：实现者定。
setInterval(renderMembers, 5000);

// 音量滑条：拖动时只改旁边的数字，松手才发给主机（一次拖动只调一次板子）
$("members").addEventListener("pointerdown", (e) => { if (e.target.matches(".vol input")) volDragging = true; });
$("members").addEventListener("input", (e) => {
  if (e.target.matches(".vol input")) e.target.nextElementSibling.textContent = e.target.value;
});
$("members").addEventListener("change", async (e) => {
  if (!e.target.matches(".vol input")) return;
  volDragging = false;
  $("err").textContent = await setVolume(e.target.dataset.role, Number(e.target.value));
  renderMembers();
});
document.addEventListener("pointerup", () => { if (volDragging) setTimeout(() => { volDragging = false; }, 0); });
$("sound").onclick = () => {
  enableSound();
  $("sound").disabled = true; $("sound").textContent = "声音已开"; $("sound").title = "本网页是角色的设备";
};
$("mic").onclick = async () => {
  const err = await setMic(!micOn);
  $("err").textContent = err;
};
$("login").onsubmit = (e) => {
  e.preventDefault();
  const t = $("tok").value.trim(); if (!t) return;
  $("tok").value = ""; document.body.classList.remove("need-token"); setToken(t);
};
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("in").value.trim(); if (!text || room == null) return;
  const err = await postMessage(text);
  $("err").textContent = err;           // 失败时保留输入框内容，成功才清空
  if (!err && $("in").value.trim() === text) $("in").value = "";
};
renderMembers();
connect();
</script>
</body>
</html>
