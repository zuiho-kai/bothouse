<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Wiki 星河 · CoNest</title>
<link rel="icon" href="data:,">
<style>
:root{--text:#e9eef8;--muted:#8d9bb4;--line:#ffffff1a;--panel:#0b1020cc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02030a;color:var(--text);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.top{position:fixed;left:22px;top:18px;right:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;pointer-events:none}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:3px;background:linear-gradient(90deg,#fff6d8,#ffd27a 40%,#9ad7ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #ffd27a33}
.brand p{margin:4px 0 0;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
.links{display:flex;gap:8px;pointer-events:auto}
.links a,.links button{border:1px solid var(--line);background:#0b1020aa;color:#cfd9ea;border-radius:99px;padding:6px 14px;font-size:12px;text-decoration:none;cursor:pointer;backdrop-filter:blur(6px)}
.links a:hover,.links button:hover{border-color:#ffffff40;color:#fff}
.legend{position:fixed;left:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(720px,calc(100vw - 36px))}
.legend span.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#0b1020aa;color:#cfd9ea;border-radius:99px;padding:4px 11px 4px 9px;font-size:12px;cursor:default;backdrop-filter:blur(6px)}
.legend span.chip i{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.legend span.chip b{font-weight:500;color:var(--text)}
.legend span.chip span{color:var(--muted);font:11px ui-monospace,Menlo,monospace}
.card{position:fixed;right:18px;top:78px;width:min(360px,calc(100vw - 36px));max-height:calc(100dvh - 150px);overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(14px);padding:16px 18px;box-shadow:0 20px 60px #000a;animation:in .25s ease-out}
.card[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card .grp{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;color:var(--muted)}
.card .grp i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.card h2{margin:6px 0 2px;font-size:18px;line-height:1.35}
.card .path{font:11px ui-monospace,Menlo,monospace;color:#6f7d96;word-break:break-all}
.card .desc{margin:10px 0 0;color:#cdd6e6}
.card pre{margin:10px 0 0;white-space:pre-wrap;font:12px/1.6 system-ui,"PingFang SC",sans-serif;color:#9fb0c9;border-left:2px solid #ffffff22;padding-left:10px}
.card .meta{margin-top:10px;font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.card h3{margin:14px 0 6px;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:600}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.card li button{all:unset;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:#cfd9ea;padding:3px 6px;border-radius:7px;width:100%;box-sizing:border-box}
.card li button:hover{background:#ffffff0d}
.card li i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.card .x{position:absolute;right:10px;top:8px;all:unset;cursor:pointer;color:var(--muted);font-size:18px;position:absolute}
.msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:2px;pointer-events:none}
.hint{position:fixed;right:18px;bottom:18px;color:#5d6a82;font-size:11px;letter-spacing:1px;pointer-events:none}
@media (max-width:640px){.brand h1{font-size:20px}.hint{display:none}.card{top:auto;bottom:70px;max-height:45dvh}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="top">
  <div class="brand"><h1>WIKI 星河</h1><p id="stats">正在点亮星星…</p></div>
  <div class="links"><a href="/collab/desk">团队工作台</a><a href="/collab">频道</a></div>
</div>
<div class="legend" id="legend"></div>
<aside class="card" id="card" hidden></aside>
<div class="msg" id="msg"></div>
<div class="hint">拖动旋转 · 滚轮缩放 · 点星看页</div>
<script>
// 经面板 /dsh/ 转发时页面挂在前缀下：接口和链接都按当前地址带上前缀，直连时前缀为空。
const ROOT = (location.pathname.match(/^(.*?)\/collab(?:\/|$)/) || ['', ''])[1];
document.querySelectorAll('a[href^="/collab"]').forEach(a => a.setAttribute('href', ROOT + a.getAttribute('href')));
'use strict';
// 视觉取向参照 leesingx/dsh-Memory-Galaxy（旋臂星系）与 Agentage Galaxy（按文件夹分色星团）。
const PALETTE = { '': '#fff1c9', ai: '#ff7ab6', bots: '#7dd3fc', hopover: '#b79cff', infra: '#4ade80', mac: '#e5e7eb', misc: '#fbbf24', projects: '#fb923c', refs: '#60a5fa', tooling: '#5eead4' };
const GROUP_NAME = { '': '核心' };
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// 确定性的伪随机：同一本 wiki 每次打开是同一片天。
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = seed || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; }
function gauss(r) { return Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r()); }
function colorOf(group) {
  if (PALETTE[group]) return PALETTE[group];
  return `hsl(${hash(group) % 360} 85% 70%)`;
}
function rgba(hex, a) {
  if (hex.startsWith('hsl')) return hex.replace(')', ` / ${a})`);
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function sprite(color) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.12, color); grad.addColorStop(0.35, rgba(color, 0.35)); grad.addColorStop(1, rgba(color, 0));
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return c;
}

let nodes = [], links = [], byId = new Map(), groups = [], sprites = {}, nebula = [], dust = [];
let focusGroup = null, selected = null, hovered = null;
const cam = { yaw: 0.6, pitch: 1.02, dist: 1750, targetDist: 1750, spin: true, vyaw: 0.012 };
const born = performance.now();

function layout(data) {
  nodes = data.nodes.map(n => ({ ...n, deg: 0, nbr: [] }));
  byId = new Map(nodes.map(n => [n.id, n]));
  links = data.links.map(l => ({ s: byId.get(l.source), t: byId.get(l.target) })).filter(l => l.s && l.t);
  for (const l of links) { l.s.deg++; l.t.deg++; l.s.nbr.push(l.t); l.t.nbr.push(l.s); }
  groups = Object.entries(data.groups).sort((a, b) => (a[0] === '') - (b[0] === '') || b[1] - a[1]).map(([id, count]) => ({ id, count, color: colorOf(id) }));
  for (const g of groups) sprites[g.id] = sprite(g.color);
  const arms = groups.filter(g => g.id !== '');
  const R0 = 170, R1 = 900;
  arms.forEach((g, gi) => {
    g.angle = (gi / arms.length) * Math.PI * 2;
    const members = nodes.filter(n => n.group === g.id);
    const clusters = [...new Set(members.map(n => n.cluster.split('/').slice(0, 2).join('/')))].sort();
    for (const n of members) {
      const r = rng(hash(n.id));
      const key = n.cluster.split('/').slice(0, 2).join('/');
      const isIndex = n.id === `${g.id}/README.md`;
      const t = isIndex ? 0 : (clusters.indexOf(key) + 0.5 + gauss(r) * 0.28) / clusters.length;
      const rad = R0 + Math.max(0, t) * (R1 - R0) + gauss(r) * 26;
      const ang = g.angle + rad * 0.0042 + gauss(r) * (0.07 + 0.05 * (1 - t));
      n.x = Math.cos(ang) * rad; n.z = Math.sin(ang) * rad;
      n.y = gauss(r) * (10 + 46 * Math.max(0, 1 - t));
    }
    g.tip = { x: Math.cos(g.angle + R1 * 0.0042) * (R1 + 90), y: 0, z: Math.sin(g.angle + R1 * 0.0042) * (R1 + 90) };
  });
  for (const n of nodes.filter(n => n.group === '')) {
    const r = rng(hash(n.id));
    const a = r() * Math.PI * 2, d = 18 + r() * 50;
    n.x = Math.cos(a) * d; n.z = Math.sin(a) * d; n.y = gauss(r) * 14;
  }
  for (const n of nodes) {
    n.size = 2.2 + Math.sqrt(n.deg) * 1.9;
    n.color = colorOf(n.group);
    n.r = Math.hypot(n.x, n.z);
    n.tw = rng(hash(n.id) ^ 99)() * Math.PI * 2;
  }
  // 星云：沿每条旋臂撒一团团的暗光，和每颗星同色。
  const r = rng(7);
  nebula = nodes.filter((_, i) => i % 4 === 0 && _.group !== '').map(n => ({ x: n.x + gauss(r) * 40, y: n.y * 0.5, z: n.z + gauss(r) * 40, color: n.color, s: 70 + r() * 90 }));
  // 星尘：旋臂之间的细碎背景星，让盘面不空。
  dust = Array.from({ length: 2600 }, () => {
    const g = arms[Math.floor(r() * arms.length)] ?? { angle: 0 };
    const rad = 60 + Math.pow(r(), 0.7) * (R1 + 160);
    const ang = g.angle + rad * 0.0042 + gauss(r) * 0.35;
    return { x: Math.cos(ang) * rad, y: gauss(r) * 18, z: Math.sin(ang) * rad, a: 0.15 + r() * 0.5 };
  });
}

const sky = (() => { const r = rng(42); return Array.from({ length: 900 }, () => ({ x: r(), y: r(), a: 0.1 + r() * 0.6, s: r() < 0.08 ? 1.6 : 0.8, tw: r() * 6 })); })();

let cy = 1, sy = 0, cp = 1, sp = 0;
function project(p) {
  const x1 = p.x * cy - p.z * sy;
  const z1 = p.x * sy + p.z * cy;
  const y2 = p.y * cp - z1 * sp;
  const z2 = p.y * sp + z1 * cp;
  const depth = cam.dist + z2;
  if (depth < 40) return null;
  const k = Math.min(W, H) * 0.95 / depth;
  return { x: W / 2 + x1 * k, y: H / 2 + y2 * k, k, depth };
}

function related(n) { return selected && (n === selected || selected.nbr.includes(n)); }
function dimmed(n) {
  if (selected) return !related(n);
  return focusGroup !== null && n.group !== focusGroup;
}

function frame(now) {
  const age = (now - born) / 1000;
  if (cam.spin && !dragging) cam.yaw += cam.vyaw / 60;
  cam.dist += (cam.targetDist - cam.dist) * 0.06;
  cy = Math.cos(cam.yaw); sy = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
  // 远处的天幕
  for (const s of sky) {
    const x = ((s.x * W + cam.yaw * 12) % W + W) % W;
    ctx.fillStyle = `rgba(200,215,255,${s.a * (0.6 + 0.4 * Math.sin(age * 1.3 + s.tw))})`;
    ctx.fillRect(x, s.y * H, s.s, s.s);
  }
  ctx.globalCompositeOperation = 'lighter';
  const reveal = Infinity;
  // 银心
  const core = project({ x: 0, y: 0, z: 0 });
  if (core) {
    const rr = 260 * core.k;
    const g = ctx.createRadialGradient(core.x, core.y, 0, core.x, core.y, rr);
    g.addColorStop(0, 'rgba(255,240,205,0.55)'); g.addColorStop(0.25, 'rgba(255,200,140,0.18)'); g.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = g; ctx.fillRect(core.x - rr, core.y - rr, rr * 2, rr * 2);
  }
  for (const b of nebula) {
    const p = project(b); if (!p) continue;
    if (Math.hypot(b.x, b.z) > reveal) continue;
    const rr = b.s * p.k;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    const a = focusGroup !== null || selected ? 0.025 : 0.05;
    g.addColorStop(0, rgba(b.color, a)); g.addColorStop(1, rgba(b.color, 0));
    ctx.fillStyle = g; ctx.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2);
  }
  ctx.fillStyle = 'rgba(210,220,255,0.5)';
  for (const d of dust) {
    if (Math.hypot(d.x, d.z) > reveal) continue;
    const p = project(d); if (!p) continue;
    ctx.globalAlpha = d.a; ctx.fillRect(p.x, p.y, 1, 1);
  }
  ctx.globalAlpha = 1;
  // 星轨：[[链接]]
  for (const n of nodes) n.p = n.r <= reveal ? project(n) : null;
  ctx.lineWidth = 0.6;
  for (const l of links) {
    const a = l.s.p, b = l.t.p; if (!a || !b) continue;
    const hot = selected && (l.s === selected || l.t === selected);
    const grp = focusGroup !== null && (l.s.group === focusGroup || l.t.group === focusGroup);
    let alpha = selected ? (hot ? 0.75 : 0.015) : focusGroup !== null ? (grp ? 0.22 : 0.012) : 0.07;
    ctx.strokeStyle = rgba(l.s.color, alpha);
    ctx.lineWidth = hot ? 1.3 : 0.6;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // 星
  for (const n of nodes) {
    const p = n.p; if (!p) continue;
    const dim = dimmed(n);
    const tw = 0.82 + 0.18 * Math.sin(age * 2 + n.tw);
    const s = n.size * p.k * 6.5 * (n === selected ? 1.8 : n === hovered ? 1.4 : 1) * tw;
    ctx.globalAlpha = dim ? 0.12 : 1;
    ctx.drawImage(sprites[n.group], p.x - s, p.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // 星团名和最亮的几颗星的名字
  ctx.textAlign = 'center';
  for (const g of groups) {
    if (!g.tip) continue;
    const p = project(g.tip); if (!p) continue;
    ctx.font = '600 13px system-ui,"PingFang SC",sans-serif';
    ctx.fillStyle = rgba(g.color.startsWith('#') ? g.color : '#ffffff', focusGroup === null || focusGroup === g.id ? 0.9 : 0.25);
    ctx.fillText((GROUP_NAME[g.id] ?? g.id).toUpperCase(), p.x, p.y);
  }
  const labelled = selected ? [selected, ...[...new Set(selected.nbr)].sort((a, b) => b.deg - a.deg).slice(0, 14)] : hubs;
  ctx.font = '12px system-ui,"PingFang SC",sans-serif';
  for (const n of labelled) {
    const p = n.p; if (!p) continue;
    ctx.fillStyle = n === selected ? '#ffffff' : 'rgba(220,230,250,0.75)';
    ctx.fillText(short(n.title), p.x, p.y - n.size * p.k * 6.5 - 6);
  }
  requestAnimationFrame(frame);
}
let hubs = [];
function short(t) { return t.length > 18 ? t.slice(0, 17) + '…' : t; }

// 交互：拖动转、滚轮/双指缩放、点星看页
let dragging = false, moved = 0, last = null, pinch = null, idleTimer;
const pointers = new Map();
function pause() { clearTimeout(idleTimer); }
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); dragging = true; moved = 0; last = e; canvas.classList.add('drag'); pause(); });
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch) cam.targetDist = clampDist(cam.targetDist * pinch / d);
    pinch = d; moved += 10; return;
  }
  if (dragging && last) {
    const dx = e.clientX - last.clientX, dy = e.clientY - last.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    cam.yaw -= dx * 0.005;
    cam.pitch = Math.max(0.15, Math.min(1.5, cam.pitch - dy * 0.004));
    last = e; return;
  }
});
function up(e) {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (pointers.size) return;
  dragging = false; canvas.classList.remove('drag');
  if (moved < 5) select(pick(e.clientX, e.clientY));
  last = null;
}
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.targetDist = clampDist(cam.targetDist * Math.exp(e.deltaY * 0.0012)); }, { passive: false });
function clampDist(d) { return Math.max(260, Math.min(3200, d)); }
function pick(x, y) {
  let best = null, bd = 14 * 14;
  for (const n of nodes) {
    if (!n.p) continue;
    const d = (n.p.x - x) ** 2 + (n.p.y - y) ** 2;
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
addEventListener('keydown', e => { if (e.key === 'Escape') { select(null); } });

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function select(n) {
  selected = n;
  const card = $('card');
  if (!n) { card.hidden = true; return; }
  const nb = [...new Set(n.nbr)].sort((a, b) => b.deg - a.deg);
  card.innerHTML = `<button class="x" aria-label="关闭">×</button>
    <div class="grp" style="color:${n.color}"><i></i>${esc((GROUP_NAME[n.group] ?? n.group).toUpperCase())}</div>
    <h2>${esc(n.title)}</h2><div class="path">${esc(n.id)}</div>
    ${n.description ? `<p class="desc">${esc(n.description)}</p>` : ''}
    ${n.excerpt ? `<pre>${esc(n.excerpt)}</pre>` : ''}
    <div class="meta">${n.lines} 行 · ${nb.length} 条星轨</div>
    ${nb.length ? `<h3>连着的星</h3><ul>${nb.map((m, i) => `<li><button data-i="${i}" style="color:${m.color}"><i></i><span style="color:#cfd9ea">${esc(m.title)}</span></button></li>`).join('')}</ul>` : ''}`;
  card.hidden = false;
  card.querySelector('.x').onclick = () => select(null);
  card.querySelectorAll('li button').forEach(b => { b.onclick = () => select(nb[Number(b.dataset.i)]); });
}

async function load() {
  let data;
  try {
    const res = await fetch(ROOT + '/collab/api/wiki-galaxy', { credentials: 'same-origin' });
    if (!res.ok) throw new Error(String(res.status));
    data = await res.json();
  } catch (error) {
    $('msg').textContent = `读不到 wiki（${error.message}）`;
    $('stats').textContent = '';
    return;
  }
  if (!data.nodes.length) { $('msg').textContent = 'wiki 目录里还没有页面'; $('stats').textContent = ''; return; }
  layout(data);
  hubs = [...nodes].sort((a, b) => b.deg - a.deg).slice(0, 8);
  $('stats').textContent = `${nodes.length} 颗星 · ${links.length} 条星轨 · ${groups.length} 个星团`;
  const legend = $('legend');
  for (const g of groups) {
    const b = document.createElement('span');
    b.className = 'chip';
    b.dataset.g = g.id; b.style.color = g.color;
    b.innerHTML = `<i></i><b>${esc(GROUP_NAME[g.id] ?? g.id)}</b><span>${g.count}</span>`;
    legend.append(b);
  }
}
load();
requestAnimationFrame(frame);
</script>
</body>
</html>
