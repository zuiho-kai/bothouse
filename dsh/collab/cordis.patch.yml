# Bundle patch applied when this package is listed in a profile's dsh.profile.bundles.
# Paths default to $CONEST_COLLAB_DATA / $CONEST_COLLAB_WORKSPACE, else ~/.conest-collab and the cwd.
# Optional leadMember is a stable agent id, not its display name; explicit config wins over CONEST_COLLAB_LEAD.
# No lead is chosen automatically. Plain human messages go to the lead; explicit @ overrides it.
- insert:
    - id: conest-collab
      name: conest-collab
      config:
        dataDir: !!js process.env.CONEST_COLLAB_DATA || (process.env.HOME + '/.conest-collab')
        workspacePath: !!js process.env.CONEST_COLLAB_WORKSPACE || process.cwd()
        leadMember: !!js process.env.CONEST_COLLAB_LEAD || undefined
- insert:
    - id: conest-channels-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-discord'
