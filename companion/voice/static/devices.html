<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共栖 · 两位伙伴的家</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/devices.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/">共栖</a><span class="mode-pill">电脑设备模拟</span></header>
    <section class="intro">
      <p class="eyebrow">一位伙伴，一个固定入口</p>
      <h1>两位伙伴，各自在场。</h1>
      <p class="intro-copy">打开两扇窗口，轮流说说话。一位播完后，再去另一位那里；按「停止本轮」后，迟到的声音也不会继续。</p>
    </section>
    <p id="error" class="error-banner" role="alert" hidden></p>
    <div id="devices" class="workspace" aria-label="固定伙伴设备"></div>
    <footer>声音从电脑扬声器输出 · 两台实体设备尚未接入</footer>
  </main>
</body>
</html>
