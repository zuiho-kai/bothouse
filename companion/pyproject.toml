[project]
name = "conest-companion"
version = "0.1.0"
description = "CoNest desktop voice, shared memory, autonomous activities and journals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-timeout>=2.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
